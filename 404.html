  <style>
    :root { --bg:#0e0f0c; --ink:#fff; --muted:#8b9080; --accent:#a0ff00; }
    * { box-sizing:border-box; margin:0; }
    html,body { height:100%; }
    body {
      font-family:'Inter',system-ui,Arial,sans-serif; color:var(--ink);
      background:
        radial-gradient(680px 420px at 50% 38%, rgba(160,255,0,.14), transparent 62%),
        linear-gradient(160deg,#12140e,#0a0b08 75%);
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      min-height:100vh; text-align:center; padding:40px 24px; position:relative; overflow:hidden;
    }
    .ghost404 {
      position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
      font-size:min(52vw,560px); font-weight:800; line-height:1; letter-spacing:-.04em;
      color:rgba(160,255,0,.05); user-select:none; pointer-events:none; z-index:0;
    }
    .stack { position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; gap:6px; }
    .logo {
      width:132px; height:132px; border-radius:50%; object-fit:contain; margin-bottom:22px;
      box-shadow:0 0 0 3px rgba(160,255,0,.25), 0 0 46px rgba(160,255,0,.4);
      animation:float 4s ease-in-out infinite;
    }
    @keyframes float { 50% { transform:translateY(-10px); } }
    .eyebrow { font-size:13px; font-weight:600; letter-spacing:.28em; text-transform:uppercase; color:var(--accent); }
    h1 { font-size:clamp(44px,11vw,84px); font-weight:800; letter-spacing:-.02em; line-height:1; margin:8px 0 14px; }
    p { color:var(--muted); font-size:16px; max-width:34ch; line-height:1.6; }
    .btn {
      margin-top:30px; display:inline-block; text-decoration:none; font-weight:700; font-size:14px;
      letter-spacing:.04em; color:#0a0b08; background:var(--accent); padding:14px 30px; border-radius:999px;
      box-shadow:0 8px 26px rgba(160,255,0,.28); transition:transform .15s ease, box-shadow .15s ease;
    }
    .btn:hover { transform:translateY(-2px); box-shadow:0 12px 32px rgba(160,255,0,.45); }
    .btn:focus-visible { outline:3px solid #fff; outline-offset:3px; }
    @media (prefers-reduced-motion:reduce) { .logo { animation:none; } }

    /* Floating work thumbnails in the background — parallax to the cursor */
    .float-field { position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
    .float-card { position:absolute; transform:translate(var(--px,0px), var(--py,0px)); will-change:transform; }
    .float-card img {
      display:block; width:var(--w,480px); max-width:82vw; border-radius:14px;
      opacity:.14; box-shadow:0 14px 40px rgba(0,0,0,.6); border:1px solid rgba(255,255,255,.06);
      transform:rotate(var(--rot,0deg)) scale(var(--sc,1));
      animation:fcbob var(--dur,8s) ease-in-out var(--delay,0s) infinite;
      transition:opacity .35s ease, box-shadow .35s ease, filter .35s ease;
      cursor:pointer; pointer-events:auto;
    }
    @keyframes fcbob {
      0%,100% { transform:rotate(var(--rot,0deg)) scale(var(--sc,1)) translateY(0); }
      50%     { transform:rotate(var(--rot,0deg)) scale(var(--sc,1)) translateY(-16px); }
    }
    .float-card img:hover {
      opacity:.95; filter:saturate(1.15);
      box-shadow:0 18px 52px rgba(160,255,0,.28), 0 14px 40px rgba(0,0,0,.6);
    }
    @media (prefers-reduced-motion:reduce) { .float-card img { animation:none; } }
    /* Mobile: fewer + smaller floaters (JS also thins the count) so they don't
       pile up and overlap. Desktop is untouched. */
    @media (max-width:768px) {
      .float-card img { max-width:38vw; border-radius:10px; box-shadow:0 8px 22px rgba(0,0,0,.6); }
    }
  </style>
</head>

          img.style.setProperty('--rot', '0deg');
          img.style.setProperty('--sc', (0.8 + Math.random() * 0.5).toFixed(2));
          img.style.setProperty('--dur', (6 + Math.random() * 4).toFixed(1) + 's');
          img.style.setProperty('--delay', (-Math.random() * 8).toFixed(1) + 's');
          wrap.appendChild(img); field.appendChild(wrap); cards.push(wrap);
        });
        startParallax();
      }
      function fallbackGames() {
        var names = ['starship-troopers','pvz-bfn','dead-rising-4','squad','star-trek-legends',
                     'tomb-raider-reloaded','skara','motion-sports','your-shape','mad-streets',
                     'espn-sports-connection','tintin-x360'];
        buildCards(names.map(function (n) { return base + 'images/gameography/' + n + '.jpg'; }));
      }
      fetch(base + 'data.json').then(function (r) { return r.json(); }).then(function (d) {
        var items = (d.work || []).filter(function (it) { return it.img && !it.mp4 && !it.video && !it.embed; });
        items.sort(function () { return Math.random() - 0.5; });   // shuffle
        var seen = {}, urls = [];
        items.forEach(function (it) {
          if (urls.length >= slots.length) return;
          var g = it.group || it.title;
          if (seen[g]) return; seen[g] = 1;                        // one still per project
          urls.push((it.img || '').replace('/4k/', '/large/'));    // lighter variant
        });
        if (urls.length) buildCards(urls); else fallbackGames();
      }).catch(fallbackGames);

      function startParallax() {
      if (reduce) return;
      var tx = 0, ty = 0, cx = 0, cy = 0;
      window.addEventListener('pointermove', function (e) {
        tx = (e.clientX / innerWidth - 0.5); ty = (e.clientY / innerHeight - 0.5);
      }, { passive: true });
      (function loop() {
        cx += (tx - cx) * 0.05; cy += (ty - cy) * 0.05;
        for (var i = 0; i < cards.length; i++) {
          var d = +cards[i].dataset.depth;
          cards[i].style.setProperty('--px', (cx * d * 70).toFixed(1) + 'px');
          cards[i].style.setProperty('--py', (cy * d * 70).toFixed(1) + 'px');
        }
        requestAnimationFrame(loop);
      })();
      }
    })();
  </script>
</body>
</html>
