<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Board Viewer</title>
<meta name="description" content="A read-only online view of a Core Board reference board." />
<meta name="robots" content="noindex, nofollow" />
<meta name="googlebot" content="noindex, nofollow" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  :root{ --bg:#0c0f0a; --panel:#141910; --border:#2a3320; --text:#f3f6ee; --muted:#9aa390; --faint:#6c7362; --accent:#a0ff00; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
  .top{position:fixed;top:0;left:0;right:0;height:56px;z-index:10;display:flex;align-items:center;gap:14px;padding:0 16px;
    background:rgba(13,15,12,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em;text-decoration:none;color:var(--text)}
  .brand .g{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(145deg,#1e2418,#0f120d);border:1px solid var(--border)}
  .brand .g svg{width:17px;height:17px}
  .bname{color:var(--muted);font-weight:600;font-size:14px}
  .bname b{color:var(--text)}
  .pill{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);border:1px solid #30401d;background:#15200c;border-radius:999px;padding:4px 10px}
  .sp{flex:1}
  .btn{display:inline-flex;align-items:center;gap:7px;font-weight:700;font-size:13px;color:var(--text);background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:8px 13px;cursor:pointer;transition:border-color .15s,color .15s}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn svg{width:15px;height:15px}
  #stage{position:fixed;inset:56px 0 0 0;overflow:hidden;cursor:grab;
    background:
      radial-gradient(60% 50% at 30% 0%, rgba(160,255,0,.035), transparent 60%),
      radial-gradient(rgba(255,255,255,.045) 1.2px, transparent 1.2px);
    background-size:auto, 30px 30px}
  #stage.drag{cursor:grabbing}
  canvas{display:block}
  .hint{position:fixed;left:16px;bottom:14px;z-index:9;color:var(--faint);font-size:12.5px;font-weight:600}
  .load{position:fixed;inset:56px 0 0 0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:600;z-index:8}
  .err{position:fixed;inset:56px 0 0 0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;color:var(--muted);text-align:center;padding:30px;z-index:8}
  .err code{font-family:'JetBrains Mono',monospace;color:var(--accent);font-size:13px}
  .zoom{position:fixed;right:16px;bottom:14px;z-index:9;display:flex;gap:8px}
  .zoom button{width:38px;height:38px;border-radius:10px;background:var(--panel);border:1px solid var(--border);color:var(--text);font-size:20px;font-weight:700;cursor:pointer}
  .zoom button:hover{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>
  <header class="top">
    <a class="brand" href="/coreboard/">
      <span class="g"><svg viewBox="0 0 24 24" fill="none" stroke="#a0ff00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><rect x="6" y="7" width="6" height="5" rx="1"/><path d="M14 8h4M14 12h4M6 15h12"/></svg></span>
      Core Board
    </a>
    <span class="pill">Read-only</span>
    <span class="bname" id="bname"></span>
    <span class="sp"></span>
    <button class="btn" id="fit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V5a1 1 0 0 1 1-1h4M20 9V5a1 1 0 0 0-1-1h-4M4 15v4a1 1 0 0 0 1 1h4M20 15v4a1 1 0 0 1-1 1h-4"/></svg>Fit</button>
  </header>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div class="load" id="load">Loading board…</div>
  <div class="hint" id="hint"></div>
  <div class="zoom"><button id="zout">–</button><button id="zin">+</button></div>

<script>
(function(){
  "use strict";
  var NOTE_COLORS=[[[247,226,124],[40,36,20]],[[246,178,196],[48,22,30]],[[160,206,246],[18,34,52]],[[174,222,170],[20,44,22]],[[43,45,49],[228,228,230]]];
  var FRAME_TITLE_H=34, FRAME_FONT=19, NOTE_FONT=18, NOTE_PAD=12;
  var qs=new URLSearchParams(location.search);
  var b=(qs.get('b')||'sample').replace(/[^a-zA-Z0-9_\-./]/g,'');
  var base='/board/'+b;
  var rgb=function(a){return 'rgb('+a[0]+','+a[1]+','+a[2]+')';};

  var cv=document.getElementById('cv'), ctx=cv.getContext('2d'), stage=document.getElementById('stage');
  var board=null, images={}, cam={x:0,y:0,zoom:1}, hover=null, dpr=Math.min(window.devicePixelRatio||1,2);

  function resize(){ var w=stage.clientWidth, h=stage.clientHeight; cv.width=w*dpr; cv.height=h*dpr; cv.style.width=w+'px'; cv.style.height=h+'px'; draw(); }
  function W(){return cv.width/dpr;} function H(){return cv.height/dpr;}
  function s2w(sx,sy){return [ (sx-W()/2)/cam.zoom+cam.x, (sy-H()/2)/cam.zoom+cam.y ];}
  function w2s(wx,wy){return [ (wx-cam.x)*cam.zoom+W()/2, (wy-cam.y)*cam.zoom+H()/2 ];}

  function bbox(){ var m=1e9,M=-1e9,n=1e9,N=-1e9; board.items.forEach(function(it){ m=Math.min(m,it.pos[0]); n=Math.min(n,it.pos[1]); M=Math.max(M,it.pos[0]+it.size[0]); N=Math.max(N,it.pos[1]+it.size[1]); }); return [m,n,M,N]; }
  function fit(){ if(!board||!board.items.length)return; var bb=bbox(); var bw=bb[2]-bb[0], bh=bb[3]-bb[1]; cam.x=(bb[0]+bb[2])/2; cam.y=(bb[1]+bb[3])/2; cam.zoom=Math.min(W()/(bw+120), H()/(bh+120)); cam.zoom=Math.max(0.02,Math.min(cam.zoom,4)); draw(); }

  function roundRect(x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  function wrap(text,maxw){ var words=text.split(/\s+/), lines=[], line=''; for(var i=0;i<words.length;i++){ var t=line?line+' '+words[i]:words[i]; if(ctx.measureText(t).width>maxw && line){ lines.push(line); line=words[i]; } else line=t; } if(line)lines.push(line); return lines; }

  function drawImageItem(it,sx,sy,sw,sh){
    var img=images[it.file];
    ctx.save();
    if(!img||!img.complete||!img.naturalWidth){ ctx.fillStyle='#1a2013'; roundRect(sx,sy,sw,sh,6); ctx.fill(); ctx.restore(); return; }
    roundRect(sx,sy,sw,sh,6); ctx.clip();
    if(it.grayscale) ctx.filter='grayscale(1)';
    var cr=it.crop||[0,0,1,1];
    var iw=img.naturalWidth, ih=img.naturalHeight;
    var cx0=cr[0]*iw, cy0=cr[1]*ih, cw=(cr[2]-cr[0])*iw, ch=(cr[3]-cr[1])*ih;
    var rot=(it.rotation||0)%4;
    ctx.translate(sx+sw/2, sy+sh/2);
    if(it.flip_x) ctx.scale(-1,1);
    ctx.rotate(rot*Math.PI/2);
    var dw=sw, dh=sh; if(rot===1||rot===3){ dw=sh; dh=sw; }
    ctx.drawImage(img, cx0,cy0,cw,ch, -dw/2,-dh/2, dw,dh);
    ctx.restore();
    ctx.save(); ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.lineWidth=1; roundRect(sx+.5,sy+.5,sw-1,sh-1,6); ctx.stroke(); ctx.restore();
  }
  function drawNote(it,sx,sy,sw,sh){
    var c=NOTE_COLORS[it.kind.color||0]; ctx.save();
    ctx.fillStyle=rgb(c[0]); roundRect(sx,sy,sw,sh,5*cam.zoom+2); ctx.fill();
    ctx.fillStyle=rgb(c[1]); ctx.font='600 '+(NOTE_FONT*cam.zoom).toFixed(1)+"px Inter, sans-serif"; ctx.textBaseline='top';
    var pad=NOTE_PAD*cam.zoom, lines=wrap(it.kind.text||'', sw-pad*2), lh=NOTE_FONT*cam.zoom*1.32;
    for(var i=0;i<lines.length;i++){ if(sy+pad+i*lh>sy+sh-pad*0.4)break; ctx.fillText(lines[i], sx+pad, sy+pad+i*lh); }
    ctx.restore();
  }
  function drawPalette(it,sx,sy,sw,sh){ var cols=it.kind.colors||[]; if(!cols.length)return; var cw=sw/cols.length; ctx.save(); roundRect(sx,sy,sw,sh,4); ctx.clip(); for(var i=0;i<cols.length;i++){ ctx.fillStyle=rgb(cols[i]); ctx.fillRect(sx+i*cw, sy, cw+1, sh); } ctx.restore(); }
  function drawFrame(it,sx,sy,sw,sh){ ctx.save();
    ctx.fillStyle='rgba(160,255,0,.03)'; ctx.strokeStyle='#2f3a22'; ctx.lineWidth=1.5; roundRect(sx,sy,sw,sh,9); ctx.fill(); ctx.stroke();
    var th=FRAME_TITLE_H*cam.zoom;
    ctx.fillStyle='#b9c7a2'; ctx.font='700 '+(FRAME_FONT*cam.zoom).toFixed(1)+"px Inter, sans-serif"; ctx.textBaseline='middle';
    ctx.fillText(it.kind.title||'', sx+14*cam.zoom, sy+th/2);
    ctx.restore();
  }
  function drawTags(it,sx,sy,sw,sh){ if(!it.tags||!it.tags.length)return; ctx.save(); ctx.font='700 '+(12).toFixed(0)+"px Inter, sans-serif"; ctx.textBaseline='middle';
    var x=sx, y=sy+sh+14; for(var i=0;i<it.tags.length;i++){ var t='#'+it.tags[i]; var w=ctx.measureText(t).width+18;
      ctx.fillStyle='rgba(18,23,14,.95)'; ctx.strokeStyle='#30401d'; ctx.lineWidth=1; roundRect(x,y-11,w,22,11); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#cde8a0'; ctx.fillText(t,x+9,y); x+=w+7; } ctx.restore();
  }

  function draw(){
    if(!board){return;}
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W(),H());
    var frames=board.items.filter(function(i){return i.kind&&i.kind.type==='Frame';});
    var rest=board.items.filter(function(i){return !(i.kind&&i.kind.type==='Frame');});
    function one(it){ var p=w2s(it.pos[0],it.pos[1]); var sx=p[0],sy=p[1],sw=it.size[0]*cam.zoom,sh=it.size[1]*cam.zoom;
      var k=(it.kind&&it.kind.type)||'Image';
      if(k==='Frame') drawFrame(it,sx,sy,sw,sh);
      else if(k==='Note') drawNote(it,sx,sy,sw,sh);
      else if(k==='Palette') drawPalette(it,sx,sy,sw,sh);
      else drawImageItem(it,sx,sy,sw,sh);
      if(hover===it && k!=='Frame') drawTags(it,sx,sy,sw,sh);
    }
    frames.forEach(one); rest.forEach(one);
  }

  function itemAt(sx,sy){ // topmost non-frame first, then frames
    var r=board.items; for(var i=r.length-1;i>=0;i--){ var it=r[i]; if(it.kind&&it.kind.type==='Frame')continue; var p=w2s(it.pos[0],it.pos[1]); if(sx>=p[0]&&sy>=p[1]&&sx<=p[0]+it.size[0]*cam.zoom&&sy<=p[1]+it.size[1]*cam.zoom)return it; } return null; }

  // interaction
  var dragging=false, px=0,py=0;
  stage.addEventListener('mousedown',function(e){ dragging=true; px=e.clientX; py=e.clientY; stage.classList.add('drag'); });
  window.addEventListener('mouseup',function(){ dragging=false; stage.classList.remove('drag'); });
  window.addEventListener('mousemove',function(e){ if(dragging){ cam.x-=(e.clientX-px)/cam.zoom; cam.y-=(e.clientY-py)/cam.zoom; px=e.clientX; py=e.clientY; draw(); } else { var r=stage.getBoundingClientRect(); var h=itemAt(e.clientX-r.left,e.clientY-r.top); if(h!==hover){ hover=h; draw(); } } });
  stage.addEventListener('wheel',function(e){ e.preventDefault(); var r=stage.getBoundingClientRect(); var mx=e.clientX-r.left,my=e.clientY-r.top; var before=s2w(mx,my); var f=Math.exp(-e.deltaY*0.0014); cam.zoom=Math.max(0.02,Math.min(cam.zoom*f,8)); var after=s2w(mx,my); cam.x+=before[0]-after[0]; cam.y+=before[1]-after[1]; draw(); },{passive:false});
  stage.addEventListener('dblclick',fit);
  document.getElementById('fit').addEventListener('click',fit);
  document.getElementById('zin').addEventListener('click',function(){ cam.zoom=Math.min(cam.zoom*1.25,8); draw(); });
  document.getElementById('zout').addEventListener('click',function(){ cam.zoom=Math.max(cam.zoom/1.25,0.02); draw(); });
  window.addEventListener('resize',resize);

  function titleCase(s){ return s.split(/[-_\/]/).filter(Boolean).map(function(w){return w.charAt(0).toUpperCase()+w.slice(1);}).join(' '); }

  fetch(base+'/board.json').then(function(r){ if(!r.ok)throw new Error(r.status); return r.json(); }).then(function(data){
    board=data;
    document.getElementById('bname').innerHTML='<b>'+titleCase(b.split('/').pop())+'</b>';
    var n=board.items.filter(function(i){return i.kind&&i.kind.type==='Image';}).length;
    document.getElementById('hint').textContent=board.items.length+' items · '+n+' images · drag to pan, scroll to zoom';
    // preload images
    var imgs=board.items.filter(function(i){return !i.kind||i.kind.type==='Image';});
    var left=imgs.length;
    if(!left){ document.getElementById('load').style.display='none'; resize(); fit(); return; }
    imgs.forEach(function(it){ if(!it.file){left--;return;} var im=new Image(); im.onload=im.onerror=function(){ if(--left<=0){ done(); } }; im.src=base+'/images/'+encodeURIComponent(it.file); images[it.file]=im; });
    function done(){ document.getElementById('load').style.display='none'; resize(); fit(); }
    // safety: if some never fire
    setTimeout(function(){ if(document.getElementById('load').style.display!=='none'){ done(); } }, 6000);
  }).catch(function(e){
    document.getElementById('load').style.display='none';
    var d=document.createElement('div'); d.className='err';
    d.innerHTML="<div>Couldn't load this board.</div><code>"+base+"/board.json</code><div style='font-size:13px'>Publish a board folder (board.json + images/) here, or open with <code>?b=&lt;name&gt;</code>.</div>";
    document.body.appendChild(d);
  });
})();
</script>
</body>
</html>
