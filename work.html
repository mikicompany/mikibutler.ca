<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache" />
  <title>Work — Miki Butler</title>
  <meta name="description" content="Portfolio of environment art by Miki Butler — Starship Troopers Extermination, Dead Rising 4, Plants vs Zombies, and more." />
  <meta name="keywords" content="environment art portfolio, game art, 3D environments, Starship Troopers, Dead Rising, Miki Butler" />
  <link rel="canonical" href="https://mikibutler.ca/work.html" />
  <link rel="stylesheet" href="css/style.css?v=20260705b" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <aside class="sidebar">
    <a href="index.html" class="sidebar-logo" aria-label="Miki Butler home"><img src="images/logo512.jpg" alt="Miki Butler" /></a>
    <nav id="sidebar-nav"></nav>
    <div class="sidebar-socials" id="sidebar-socials"></div>
    <p class="sidebar-copy">© All rights reserved<br>Miki Butler</p>
  </aside>

  <main>
    <div class="work-header">
      <h1>Work</h1>
      <div class="filters" id="filters"></div>
    </div>
    <div class="masonry-grid" id="work-grid"></div>
  </main>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
    <span class="lightbox-close" aria-label="Close">&times;</span>
    <button class="lightbox-prev" aria-label="Previous">&#8249;</button>
    <img class="lb-img" src="" alt="" />
    <iframe class="lb-video" src="" title="" frameborder="0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
    <video class="lb-vid" controls playsinline loop></video>
    <button class="lightbox-next" aria-label="Next">&#8250;</button>
    <div class="lightbox-caption"></div>
  </div>

  <script src="js/sidebar.js"></script>
  <script>
    const CATEGORY_LABELS = {
      'starship-troopers': 'Starship Troopers',
      'dead-rising': 'Dead Rising',
      'pvz': 'Plants vs Zombies',
      'squad': 'Squad',
      'personal': 'Personal Work',
      'other': 'Other'
    };

    let allItems = [];
    let currentFilter = 'all';
    let currentGroup = null;
    let lightboxItems = [];
    let lightboxIndex = 0;

    const grid = document.getElementById('work-grid');
    const workHeader = document.querySelector('.work-header');

    function boot(data) {
      allItems = data.work || [];
      allItems.forEach(i => { if (!i.group) i.group = i.title.split(' — ')[0]; });
      rebuildFilters();
      // Deep-link: work.html?group=NAME opens that album; &item=TITLE opens
      // that exact piece in the lightbox (used by the homepage slides).
      const params = new URLSearchParams(location.search);
      const target = params.get('group');
      if (target) currentGroup = getGroups().find(g => g.name === target) || null;
      render();
      const targetItem = params.get('item');
      if (currentGroup && targetItem) {
        const idx = currentGroup.items.findIndex(it => it.title === targetItem);
        if (idx >= 0) { lightboxItems = currentGroup.items; openLightbox(idx); }
      }
    }

    // When opened from the admin (Live Preview tab or docked preview), render
    // the in-memory (possibly unsaved) data handed over via sessionStorage
    // instead of the committed data.json.
    let previewData = null;
    if (new URLSearchParams(location.search).has('preview')) {
      try { previewData = JSON.parse(sessionStorage.getItem('mb-preview')); } catch (_) {}
    }
    if (previewData) {
      // Defer to a microtask so the rest of this script (e.g. sizeOf) is
      // initialized before render() runs.
      Promise.resolve().then(() => boot(previewData));
    } else {
      fetch('data.json').then(r => r.json()).then(boot);
    }

    // Live updates from the admin's docked preview: re-render in place while
    // preserving the viewer's current filter and open album.
    window.addEventListener('message', e => {
      if (!e.data || e.data.type !== 'mb-preview' || !e.data.data) return;
      const prevFilter = currentFilter;
      const prevGroup = currentGroup && currentGroup.name;
      allItems = e.data.data.work || [];
      allItems.forEach(i => { if (!i.group) i.group = i.title.split(' — ')[0]; });
      rebuildFilters();
      currentGroup = prevGroup ? (getGroups().find(g => g.name === prevGroup) || null) : null;
      render();
    });

    function rebuildFilters() {
      const container = document.getElementById('filters');
      container.innerHTML = '';
      const cats = [...new Set(allItems.map(i => i.category).filter(Boolean))]
        .sort((a, b) => catRank(a) - catRank(b));
      cats.forEach((cat, i) => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn' + (i === 0 ? ' active' : '');
        btn.dataset.filter = cat;
        btn.textContent = CATEGORY_LABELS[cat] || cat;
        container.appendChild(btn);
      });
    }

    // Category chips are in-page jump links to each section — no filtering,
    // you stay on the page. (Listener attached once.)
    document.getElementById('filters').addEventListener('click', e => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const cat = btn.dataset.filter;
      const jump = () => {
        const h = document.getElementById('cat-' + cat);
        if (h) h.scrollIntoView({ behavior: 'smooth', block: 'start' });
      };
      // If we're inside an album, return to the main grid first, then jump.
      if (currentGroup) { currentGroup = null; render(); requestAnimationFrame(jump); }
      else jump();
    });

    function getGroups() {
      const map = new Map();
      allItems.forEach(i => {
        if (!map.has(i.group)) map.set(i.group, { name: i.group, category: i.category, items: [] });
        map.get(i.group).items.push(i);
      });
      return [...map.values()];
    }

    function render() {
      updateGroupBar();
      if (currentGroup) buildItemGrid(currentGroup.items);
      else buildGroupGrid(getGroups());
    }

    function updateGroupBar() {
      let bar = document.getElementById('group-bar');
      if (currentGroup) {
        if (!bar) {
          bar = document.createElement('div');
          bar.id = 'group-bar';
          bar.className = 'group-bar';
          workHeader.appendChild(bar);
        }
        const groups = getGroups();
        const pos = groups.findIndex(g => g.name === currentGroup.name);
        const prevName = groups.length > 1 ? groups[(pos - 1 + groups.length) % groups.length].name : '';
        const nextName = groups.length > 1 ? groups[(pos + 1) % groups.length].name : '';
        bar.innerHTML = `
          <button class="back-btn">&#8249; Back</button>
          <span class="group-bar-title">${currentGroup.name}</span>
          <span class="group-bar-count">${currentGroup.items.length} items</span>
          <span class="group-nav">
            <button class="group-nav-btn group-prev" title="Previous: ${prevName}" aria-label="Previous project">&#8249;</button>
            <span class="group-pos"><span class="cur">${pos + 1}</span> / ${groups.length}</span>
            <button class="group-nav-btn group-next" title="Next: ${nextName}" aria-label="Next project">&#8250;</button>
          </span>
        `;
        bar.querySelector('.back-btn').addEventListener('click', closeGroup);
        bar.querySelector('.group-prev').addEventListener('click', () => navigateGroup(-1));
        bar.querySelector('.group-next').addEventListener('click', () => navigateGroup(1));
      } else if (bar) {
        bar.remove();
      }
    }

    // Move to the previous/next project (album) in the current filtered list,
    // wrapping around at the ends.
    function navigateGroup(dir) {
      const groups = getGroups();
      if (!groups.length) return;
      const idx = groups.findIndex(g => g.name === currentGroup.name);
      currentGroup = groups[(idx + dir + groups.length) % groups.length];
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function closeGroup() {
      currentGroup = null;
      render();
    }

    function mediaBadge(item) {
      return (item.video || item.mp4 || item.embed)
        ? '<span class="play-badge" aria-hidden="true"></span>' : '';
    }

    // Repeating size pattern that always fills complete rows (2+1+1+4 = 8
    // cells = two full rows of 4), so the grid can never leave holes no
    // matter how tiles are ordered.
    const SIZES = ['small', 'wide', 'large', 'tall'];
    const sizeOf = item => SIZES.includes(item.size) ? item.size : 'small';

    // Crop focus (object-position) and zoom (scale) are stored on the item
    // and passed to the tile as CSS variables so they compose with the
    // stylesheet's hover scale.
    function tileStyle(item) {
      const parts = [];
      if (item.focus) parts.push(`--focus:${item.focus}`);
      if (item.zoom && item.zoom !== 1) parts.push(`--zoom:${item.zoom}`);
      return parts.length ? ` style="${parts.join(';')}"` : '';
    }

    function makeGroupTile(g) {
      const cover = g.items[0];
      const multi = g.items.length > 1;
      const desc = (g.items.find(i => i.description) || {}).description || '';
      const blurb = (g.items.find(i => i.blurb) || {}).blurb || '';
      const div = document.createElement('div');
      div.className = `masonry-item size-${sizeOf(cover)}`;
      div.innerHTML = `
        <img src="${cover.img}" alt="${g.name}" loading="lazy"${tileStyle(cover)} />
        ${blurb ? `<div class="tile-blurb">${blurb}</div>` : ''}
        ${multi ? `<span class="item-count">${g.items.length}</span>` : mediaBadge(cover)}
        <div class="item-overlay">
          <span class="item-tag">${CATEGORY_LABELS[g.category] || g.category || ''}</span>
          <span class="item-title">${multi ? g.name : cover.title}</span>
          ${desc ? `<span class="item-desc">${desc}</span>` : ''}
        </div>
      `;
      div.addEventListener('click', () => {
        if (multi) {
          currentGroup = g;
          render();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
          lightboxItems = g.items;
          openLightbox(0);
        }
      });
      return div;
    }

    // Section order — lead with the flagship game work, personal/other last.
    const CAT_ORDER = ['starship-troopers', 'dead-rising', 'pvz', 'squad', 'personal', 'other'];
    const catRank = c => { const i = CAT_ORDER.indexOf(c); return i < 0 ? 99 : i; };

    function buildGroupGrid(groups) {
      grid.innerHTML = '';
      grid.classList.add('sectioned');
      const byCat = new Map();
      groups.forEach(g => {
        const cat = g.category || 'other';
        if (!byCat.has(cat)) byCat.set(cat, []);
        byCat.get(cat).push(g);
      });
      [...byCat.keys()].sort((a, b) => catRank(a) - catRank(b)).forEach(cat => {
        const header = document.createElement('h2');
        header.className = 'work-cat-header';
        header.id = 'cat-' + cat;
        header.textContent = CATEGORY_LABELS[cat] || cat;
        grid.appendChild(header);
        const section = document.createElement('div');
        section.className = 'masonry-grid section-grid';
        byCat.get(cat).forEach(g => section.appendChild(makeGroupTile(g)));
        grid.appendChild(section);
      });
    }

    function buildItemGrid(items) {
      grid.innerHTML = '';
      grid.classList.remove('sectioned');
      lightboxItems = items;
      items.forEach((item, i) => {
        const div = document.createElement('div');
        div.className = `masonry-item size-${sizeOf(item)}`;
        div.innerHTML = `
          <img src="${item.img}" alt="${item.title}" loading="lazy"${tileStyle(item)} />
          ${item.blurb ? `<div class="tile-blurb">${item.blurb}</div>` : ''}
          ${mediaBadge(item)}
          <div class="item-overlay">
            <span class="item-tag">${CATEGORY_LABELS[item.category] || item.category || ''}</span>
            <span class="item-title">${item.title}</span>
            ${item.description ? `<span class="item-desc">${item.description}</span>` : ''}
          </div>
        `;
        div.addEventListener('click', () => openLightbox(i));
        grid.appendChild(div);
      });
    }

    // Lightbox
    const lightbox = document.getElementById('lightbox');
    const lbImg = lightbox.querySelector('.lb-img');
    const lbVideo = lightbox.querySelector('.lb-video');
    const lbVid = lightbox.querySelector('.lb-vid');
    const lbCaption = lightbox.querySelector('.lightbox-caption');

    function resetLightboxMedia() {
      lbImg.style.display = 'none';
      lbImg.src = '';
      lbVideo.style.display = 'none';
      lbVideo.src = '';
      lbVid.style.display = 'none';
      lbVid.pause();
      lbVid.removeAttribute('src');
    }

    function openLightbox(index) {
      lightboxIndex = index;
      const item = lightboxItems[index];
      lbCaption.textContent = item.title;
      resetLightboxMedia();
      if (item.video) {
        lbVideo.title = item.title;
        lbVideo.src = `https://www.youtube.com/embed/${item.video}?autoplay=1&rel=0`;
        lbVideo.style.display = 'block';
      } else if (item.embed) {
        lbVideo.title = item.title;
        lbVideo.src = item.embed;
        lbVideo.style.display = 'block';
      } else if (item.mp4) {
        lbVid.src = item.mp4;
        lbVid.style.display = 'block';
        lbVid.play();
      } else {
        lbImg.src = item.img;
        lbImg.alt = item.title;
        lbImg.style.display = '';
      }
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      resetLightboxMedia();
      document.body.style.overflow = '';
    }

    function navigate(dir) {
      lightboxIndex = (lightboxIndex + dir + lightboxItems.length) % lightboxItems.length;
      openLightbox(lightboxIndex);
    }

    lightbox.querySelector('.lightbox-close').addEventListener('click', closeLightbox);
    lightbox.querySelector('.lightbox-prev').addEventListener('click', () => navigate(-1));
    lightbox.querySelector('.lightbox-next').addEventListener('click', () => navigate(1));
    lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });

    document.addEventListener('keydown', e => {
      if (lightbox.classList.contains('open')) {
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') navigate(-1);
        if (e.key === 'ArrowRight') navigate(1);
      } else if (currentGroup) {
        if (e.key === 'Escape') closeGroup();
        if (e.key === 'ArrowLeft') navigateGroup(-1);
        if (e.key === 'ArrowRight') navigateGroup(1);
      }
    });
  </script>
</body>
</html>
