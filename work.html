  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer" tabindex="-1">

  </div>

  <!-- Per-thumb gamma filters are injected here at render time -->
  <svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden"><defs id="lv-defs"></defs></svg>

  <script src="js/sidebar.js"></script>
  <script src="js/fx.js" defer></script>
  <script>
    const CATEGORY_LABELS = {
      'starship-troopers': 'Starship Troopers',
      'dead-rising': 'Dead Rising',
      'pvz': 'Plants vs Zombies',
      'squad': 'Squad',
      'star-trek-legends': 'Star Trek Legends',
      'personal': 'Personal Work',
      'other': 'Other'
    };

    let allItems = [];
    let currentFilter = 'all';
    let currentGroup = null;
    let lightboxItems = [];
    let lightboxIndex = 0;
    // When the lightbox is browsing group covers (opened from a single-piece
    // work), this holds the group behind each cover so Enter / a click can
    // dive into that group's sub-pieces. Null when viewing a group's own items.
    let lightboxGroups = null;
    // The project most recently backed out of, so Enter can toggle straight
    // back into it from the main works view.
    let lastGroupName = null;

    // Grid thumbnails use ArtStation's 1920px "large" variant instead of the
    // 3840px "4k" source — ~4× lighter to load; the lightbox still uses 4k.
    const thumb = u => (u || '').replace('/4k/', '/large/');

    const grid = document.getElementById('work-grid');
    const workHeader = document.querySelector('.work-header');

    // Emit an ItemList of VisualArtwork so Google understands these are artworks
    // by Miki Butler (feeds image + artist signals). Injected once, from the data.
    let artworkLDDone = false;
    function injectArtworkLD(data) {
      if (artworkLDDone) return;
      const abs = u => /^https?:\/\//.test(u) ? u : ('https://mikibutler.ca/' + String(u || '').replace(/^\//, ''));
      const seen = {}, el = [];
      (data.work || []).forEach(i => {
        if (!i.img || i.video) return;                 // real artwork images only
        const t = i.title || i.group; if (!t || seen[t]) return; seen[t] = 1;
        if (el.length >= 60) return;
        el.push({
          "@type": "ListItem", "position": el.length + 1,
          "item": {
            "@type": "VisualArtwork",
            "name": t + " — environment art by Miki Butler",
            "image": abs(thumb(i.img)),
            "creator": { "@id": "https://mikibutler.ca/#miki" },
            "artform": "Digital environment art",
            "url": "https://mikibutler.ca/work.html" + (i.group ? "?group=" + encodeURIComponent(i.group) : "")
          }
        });
      });
      if (!el.length) return;
      const s = document.createElement('script');
      s.type = 'application/ld+json';
      s.textContent = JSON.stringify({ "@context": "https://schema.org", "@type": "ItemList", "name": "Portfolio — Miki Butler", "itemListElement": el });
      document.head.appendChild(s);
      artworkLDDone = true;
    }

    function boot(data) {
      allItems = data.work || [];
      allItems.forEach(i => { if (!i.group) i.group = i.title.split(' — ')[0]; });
      try { injectArtworkLD(data); } catch (_) {}
      rebuildFilters();
      // Deep-link: work.html?group=NAME opens that album; &item=TITLE opens
      // that exact piece in the lightbox (used by the homepage slides).
      const params = new URLSearchParams(location.search);
      const target = params.get('group');
      if (target) currentGroup = getGroups().find(g => g.name === target) || null;
      render();
      const targetItem = params.get('item');
      if (currentGroup && targetItem) {
        const idx = currentGroup.items.findIndex(it => it.title === targetItem);
        if (idx >= 0) { lightboxItems = currentGroup.items; lightboxGroups = null; openLightbox(idx); }
      }
    }

    // When opened from the admin (Live Preview tab or docked preview), render
    // the in-memory (possibly unsaved) data handed over via sessionStorage
    // instead of the committed data.json.
    let previewData = null;
    if (new URLSearchParams(location.search).has('preview')) {
      try { previewData = JSON.parse(sessionStorage.getItem('mb-preview')); } catch (_) {}
    }
    if (previewData) {
      // Defer to a microtask so the rest of this script (e.g. sizeOf) is
      // initialized before render() runs.
      Promise.resolve().then(() => boot(previewData));
    } else {
      fetch('data.json?t=' + Date.now()).then(r => r.json()).then(boot);
    }

    // Live updates from the admin's docked preview: re-render in place while
    // preserving the viewer's current filter and open album.
    window.addEventListener('message', e => {
      if (!e.data || e.data.type !== 'mb-preview' || !e.data.data) return;
      const prevFilter = currentFilter;
      const prevGroup = currentGroup && currentGroup.name;
      allItems = e.data.data.work || [];
      allItems.forEach(i => { if (!i.group) i.group = i.title.split(' — ')[0]; });
      rebuildFilters();
      currentGroup = prevGroup ? (getGroups().find(g => g.name === prevGroup) || null) : null;
      render();
    });

    function rebuildFilters() {
      const container = document.getElementById('filters');
      container.innerHTML = '';
      const cats = [...new Set(allItems.filter(i => !i.hidden).map(i => i.category).filter(Boolean))]
        .sort((a, b) => catRank(a) - catRank(b));
      cats.forEach((cat, i) => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn';
        btn.dataset.filter = cat;
        btn.textContent = CATEGORY_LABELS[cat] || cat;
        container.appendChild(btn);
      });
    }

    // Number keys 1–5 jump to a section (matches the chip order the user wants).
    const NUM_JUMP = { '1': 'starship-troopers', '2': 'pvz', '3': 'squad', '4': 'star-trek-legends', '5': 'personal' };

    // Highlight the matching chip and smooth-scroll to that section header.
    function jumpToCategory(cat) {
      if (!cat) return;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.filter === cat));
      const jump = () => {
        const h = document.getElementById('cat-' + cat);
        if (h) h.scrollIntoView({ behavior: 'smooth', block: 'start' });
      };
      // If we're inside an album, return to the main grid first, then jump.
      if (currentGroup) { currentGroup = null; render(); requestAnimationFrame(jump); }
      else jump();
    }

    // Category chips are in-page jump links to each section — no filtering,
    // you stay on the page. (Listener attached once.)
    document.getElementById('filters').addEventListener('click', e => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      jumpToCategory(btn.dataset.filter);
    });

    function getGroups() {
      const map = new Map();
      allItems.forEach(i => {
        if (i.hidden) return; // hidden works are kept in data but never shown
        if (!map.has(i.group)) map.set(i.group, { name: i.group, category: i.category, items: [] });
        map.get(i.group).items.push(i);
      });
      return [...map.values()].filter(g => g.items.length);
    }

    function render() {
      pendingLevels.clear();
      updateGroupBar();
      if (currentGroup) buildItemGrid(currentGroup.items);
      else buildGroupGrid(getGroups());
      flushLevels();
    }

    // Per-thumb gamma (midtones) is done with an SVG filter — CSS has no gamma.
    // Filters are deduped by value and flushed into the page's <defs> each render.
    const pendingLevels = new Map();
    function levelsVar(item) {
      const g = item.gamma;
      if (!g || g === 1) return '';
      const id = 'lvg-' + String(g).replace(/[^0-9]/g, '_');
      if (!pendingLevels.has(id)) {
        const e = (1 / g).toFixed(4);
        pendingLevels.set(id, `<filter id="${id}" color-interpolation-filters="sRGB"><feComponentTransfer>` +
          `<feFuncR type="gamma" exponent="${e}"/><feFuncG type="gamma" exponent="${e}"/><feFuncB type="gamma" exponent="${e}"/>` +
          `</feComponentTransfer></filter>`);
      }
      return `--lv:url(#${id})`;
    }
    function flushLevels() {
      const defs = document.getElementById('lv-defs');
      if (defs) defs.innerHTML = [...pendingLevels.values()].join('');
    }

    // Light the category chip that matches the given category (used so the
    // header highlight always follows the project you're actually viewing).
    function highlightCategory(cat) {
      document.querySelectorAll('.filter-btn').forEach(b =>
        b.classList.toggle('active', b.dataset.filter === cat));
    }

    function updateGroupBar() {
      let bar = document.getElementById('group-bar');
      if (currentGroup) {
        highlightCategory(currentGroup.category);
        if (!bar) {
          bar = document.createElement('div');
          bar.id = 'group-bar';
          bar.className = 'group-bar';
          workHeader.appendChild(bar);
        }
        const groups = getGroups();
        const pos = groups.findIndex(g => g.name === currentGroup.name);
        const prevName = groups.length > 1 ? groups[(pos - 1 + groups.length) % groups.length].name : '';
        const nextName = groups.length > 1 ? groups[(pos + 1) % groups.length].name : '';
        bar.innerHTML = `
          <button class="back-btn">&#8249; Back</button>
          <span class="group-bar-title">${currentGroup.name}</span>
          <span class="group-bar-count">${currentGroup.items.length} items</span>
          <span class="group-nav">
            <button class="group-nav-btn group-prev" title="Previous: ${prevName}" aria-label="Previous project">&#8249;</button>
            <span class="group-pos"><span class="cur">${pos + 1}</span> / ${groups.length}</span>
            <button class="group-nav-btn group-next" title="Next: ${nextName}" aria-label="Next project">&#8250;</button>
          </span>
        `;
        bar.querySelector('.back-btn').addEventListener('click', closeGroup);
        bar.querySelector('.group-prev').addEventListener('click', () => navigateGroup(-1));
        bar.querySelector('.group-next').addEventListener('click', () => navigateGroup(1));
      } else if (bar) {
        bar.remove();
      }
    }

    // Move to the previous/next project (album) in the current filtered list,
    // wrapping around at the ends.
    function navigateGroup(dir) {
      const groups = getGroups();
      if (!groups.length) return;
      const idx = groups.findIndex(g => g.name === currentGroup.name);
      currentGroup = groups[(idx + dir + groups.length) % groups.length];
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function closeGroup() {
      currentGroup = null;
      render();
      // Back on the full grid, no single category is "current" — clear the chip.
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    }

    function mediaBadge(item) {
      return (item.video || item.mp4 || item.embed)
        ? '<span class="play-badge" aria-hidden="true"></span>' : '';
    }

    // A "preview" that's an interactive 3D model (Sketchfab / Marmoset / glTF),
    // not a video — so we can mark it with a cube instead of just a play arrow.
    function is3D(item) {
      const e = String(item.embed || item.model || '').toLowerCase();
      return item.threed === true || /sketchfab\.com|marmoset|mview|artstation\.com\/embed|\.glb|\.gltf|model-viewer/.test(e);
    }
    // 3D embeds have their own in-viewer "play" step; try to auto-start so
    // opening the lightbox is the only click needed. Sketchfab honours
    // autostart=1; ArtStation's Marmoset viewer defers the (large) .mview file
    // and may still need a click, so we pass its best-effort auto params too.
    function embedSrc(url) {
      const sep = url.includes('?') ? '&' : '?';
      if (/sketchfab\.com/.test(url)) {
        return url + sep + 'autostart=1&preload=1&ui_hint=0';
      }
      if (/artstation\.com\/embed/.test(url)) {
        return url + sep + 'autoplay=1&autostart=1';
      }
      return url;
    }
    // Corner cube chip that reads "3D" — sits next to the play badge.
    function modelTag() {
      return '<span class="model-tag" title="Interactive 3D model" aria-label="Interactive 3D model">' +
        '<svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true">' +
        '<path d="M12 2.5 L20.5 7 L20.5 17 L12 21.5 L3.5 17 L3.5 7 Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>' +
        '<path d="M3.5 7 L12 11.6 L20.5 7 M12 11.6 L12 21.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>' +
        '</svg>3D</span>';
    }

    // Repeating size pattern that always fills complete rows (2+1+1+4 = 8
    // cells = two full rows of 4), so the grid can never leave holes no
    // matter how tiles are ordered.
    const SIZES = ['small', 'wide', 'large', 'tall'];
    const sizeOf = item => SIZES.includes(item.size) ? item.size : 'small';
    // Size of a tile *inside* an album — inherits the work (group) size unless
    // the item sets its own subSize.
    const subSizeOf = item => SIZES.includes(item.subSize) ? item.subSize : sizeOf(item);

    // Crop focus (object-position) and zoom (scale) are stored on the item
    // and passed to the tile as CSS variables so they compose with the
    // stylesheet's hover scale.
    function tileStyle(item) {
      const parts = [];
      if (item.focus) parts.push(`--focus:${item.focus}`);
      if (item.zoom && item.zoom !== 1) parts.push(`--zoom:${item.zoom}`);
      if (item.bright && item.bright !== 1) parts.push(`--adj-b:${item.bright}`);
      if (item.contrast && item.contrast !== 1) parts.push(`--adj-c:${item.contrast}`);
      if (item.sat && item.sat !== 1) parts.push(`--adj-s:${item.sat}`);
      const lv = levelsVar(item);
      if (lv) parts.push(lv);
      return parts.length ? ` style="${parts.join(';')}"` : '';
    }

    function makeGroupTile(g) {
      const cover = g.items[0];
      const multi = g.items.length > 1;
      const desc = (g.items.find(i => i.description) || {}).description || '';
      const div = document.createElement('div');
      div.className = `masonry-item size-${sizeOf(cover)}`;
      div.innerHTML = `
        <img src="${thumb(cover.img)}" alt="${g.name} — environment art by Miki Butler" loading="lazy"${tileStyle(cover)} />
        ${is3D(cover) ? modelTag() : ''}
        ${multi ? `<span class="item-count">${g.items.length}</span>` : mediaBadge(cover)}
        <div class="item-overlay">
          <span class="item-tag">${CATEGORY_LABELS[g.category] || g.category || ''}</span>
          <span class="item-title">${multi ? g.name : cover.title}</span>
          ${desc ? `<span class="item-desc">${desc}</span>` : ''}
        </div>
      `;
      div.addEventListener('click', () => {
        if (multi) {
          currentGroup = g;
          render();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
          // Single-piece work: let the arrows browse across ALL works (each
          // group's cover), in the same order they appear on the grid.
          const order = groupsInDisplayOrder();
          lightboxItems = order.map(gr => gr.items[0]);
          lightboxGroups = order;
          openLightbox(Math.max(0, order.findIndex(gr => gr.name === g.name)));
        }
      });
      return div;
    }

    // Groups in the same order the grid shows them (by category rank, then
    // data order) — so lightbox arrows move like the eye does across the page.
    function groupsInDisplayOrder() {
      const byCat = new Map();
      getGroups().forEach(gr => {
        const c = gr.category || 'other';
        if (!byCat.has(c)) byCat.set(c, []);
        byCat.get(c).push(gr);
      });
      const out = [];
      [...byCat.keys()].sort((a, b) => catRank(a) - catRank(b)).forEach(c => byCat.get(c).forEach(gr => out.push(gr)));
      return out;
    }

    // Section order — lead with the flagship game work, personal/other last.
    const CAT_ORDER = ['starship-troopers', 'dead-rising', 'pvz', 'squad', 'star-trek-legends', 'personal', 'other'];
    const catRank = c => { const i = CAT_ORDER.indexOf(c); return i < 0 ? 99 : i; };

    function buildGroupGrid(groups) {
      grid.innerHTML = '';
      grid.classList.add('sectioned');
      const byCat = new Map();
      groups.forEach(g => {
        const cat = g.category || 'other';
        if (!byCat.has(cat)) byCat.set(cat, []);
        byCat.get(cat).push(g);
      });
      [...byCat.keys()].sort((a, b) => catRank(a) - catRank(b)).forEach(cat => {
        const header = document.createElement('h2');
        header.className = 'work-cat-header';
        header.id = 'cat-' + cat;
        header.textContent = CATEGORY_LABELS[cat] || cat;
        grid.appendChild(header);
        const section = document.createElement('div');
        section.className = 'masonry-grid section-grid';
        byCat.get(cat).forEach(g => section.appendChild(makeGroupTile(g)));
        grid.appendChild(section);
      });
    }

    function buildItemGrid(items) {
      grid.innerHTML = '';
      grid.classList.remove('sectioned');
      lightboxItems = items;
      lightboxGroups = null;
      items.forEach((item, i) => {
        const div = document.createElement('div');
        div.className = `masonry-item size-${subSizeOf(item)}`;
        div.innerHTML = `
          <img src="${thumb(item.img)}" alt="${item.title} — environment art by Miki Butler" loading="lazy"${tileStyle(item)} />
          ${is3D(item) ? modelTag() : ''}
          ${mediaBadge(item)}
          <div class="item-overlay">
            <span class="item-tag">${CATEGORY_LABELS[item.category] || item.category || ''}</span>
            <span class="item-title">${item.title}</span>
            ${item.description ? `<span class="item-desc">${item.description}</span>` : ''}
          </div>
        `;
        div.addEventListener('click', () => openLightbox(i));
        grid.appendChild(div);
      });
    }

    // Lightbox
    const lightbox = document.getElementById('lightbox');
    const lbImg = lightbox.querySelector('.lb-img');
    const lbVideo = lightbox.querySelector('.lb-video');
    const lbVid = lightbox.querySelector('.lb-vid');
    const lbCaption = lightbox.querySelector('.lightbox-caption');
    const lbBlurb = lightbox.querySelector('.lb-blurb');

    function resetLightboxMedia() {
      lbImg.style.display = 'none';
      lbImg.src = '';
      lbVideo.style.display = 'none';
      lbVideo.src = '';
      lbVid.style.display = 'none';
      lbVid.pause();
      lbVid.removeAttribute('src');
      lbVid.removeAttribute('poster');
    }

    function openLightbox(index) {
      lightboxIndex = index;
      const item = lightboxItems[index];
      // ArtStation's Marmoset viewer defers its large .mview file behind an
      // in-iframe load button we can't trigger cross-origin — so opening it in
      // the lightbox always needs a second click. Open it directly instead:
      // one click on the tile takes you straight into the interactive viewer.
      if (item.embed && /artstation\.com\/embed/.test(item.embed)) {
        window.open(embedSrc(item.embed), '_blank', 'noopener');
        return;
      }
      lbCaption.textContent = item.title;
      // Show the piece's blurb top-left, re-triggering the slide-in animation.
      if (item.blurb) {
        lbBlurb.textContent = item.blurb;
        lbBlurb.style.display = 'block';
        lbBlurb.classList.remove('in');
        void lbBlurb.offsetWidth; // reflow so the animation restarts each open
        lbBlurb.classList.add('in');
      } else {
        lbBlurb.style.display = 'none';
        lbBlurb.classList.remove('in');
      }
      resetLightboxMedia();
      if (item.video) {
        lbVideo.title = item.title;
        lbVideo.src = `https://www.youtube.com/embed/${item.video}?autoplay=1&rel=0`;
        lbVideo.style.display = 'block';
      } else if (item.embed) {
        lbVideo.title = item.title;
        lbVideo.src = embedSrc(item.embed);
        lbVideo.style.display = 'block';
      } else if (item.mp4) {
        if (item.img) lbVid.poster = item.img;   // show the thumbnail until the video paints a frame
        lbVid.src = item.mp4;
        lbVid.style.display = 'block';
        lbVid.play();
      } else {
        lbImg.src = item.img;
        lbImg.alt = item.title + ' — environment art by Miki Butler';
        lbImg.style.display = '';
      }
      lightbox.classList.add('open');
      // Mark when the current cover can be opened into its group, so the image
      // shows a pointer and a hint that Enter / click dives in.
      lightbox.classList.toggle('can-enter', !!enterableGroup());
      document.body.style.overflow = 'hidden';
      // Keep focus on the lightbox so arrow keys navigate (until/unless the
      // viewer clicks into a video, which hands keyboard control to the player).
      lightbox.focus();
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      resetLightboxMedia();
      document.body.style.overflow = '';
    }

    function navigate(dir) {
      lightboxIndex = (lightboxIndex + dir + lightboxItems.length) % lightboxItems.length;
      openLightbox(lightboxIndex);
    }

    // The group behind the cover currently shown, when the lightbox is browsing
    // covers and that group actually has sub-pieces to open into.
    function enterableGroup() {
      if (!lightboxGroups) return null;
      const g = lightboxGroups[lightboxIndex];
      return (g && g.items.length > 1) ? g : null;
    }

    // Dive from the cover into the group's grid of all its sub-pieces.
    function enterCurrentGroup() {
      const g = enterableGroup();
      if (!g) return;
      closeLightbox();
      currentGroup = g;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    lightbox.querySelector('.lightbox-close').addEventListener('click', closeLightbox);
    lightbox.querySelector('.lightbox-prev').addEventListener('click', () => navigate(-1));
    lightbox.querySelector('.lightbox-next').addEventListener('click', () => navigate(1));
    lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
    // Clicking the cover image dives into its group (when browsing covers).
    lbImg.addEventListener('click', e => { if (enterableGroup()) { e.stopPropagation(); enterCurrentGroup(); } });

    document.addEventListener('keydown', e => {
      // Don't hijack Enter when a button/link/field is focused (e.g. a filter
      // chip or the album's back button already handle it).
      const onControl = ['INPUT', 'TEXTAREA', 'BUTTON', 'A', 'SELECT'].includes((e.target.tagName || ''));
      // 1–5 jump to a section (Starship / PvZ / Squad / Star Trek / Personal).
      // Only on the main works grid — not inside an album or the lightbox.
      if (!onControl && !e.metaKey && !e.ctrlKey && !e.altKey &&
          !currentGroup && !lightbox.classList.contains('open') && NUM_JUMP[e.key]) {
        e.preventDefault();
        jumpToCategory(NUM_JUMP[e.key]);
        return;
      }
      if (lightbox.classList.contains('open')) {
        if (e.key === 'Escape') closeLightbox();
        if (e.key === 'ArrowLeft') navigate(-1);
        if (e.key === 'ArrowRight') navigate(1);
        if (e.key === 'Enter') { e.preventDefault(); enterCurrentGroup(); }
      } else if (currentGroup) {
        if (e.key === 'Escape') closeGroup();
        if (e.key === 'ArrowLeft') navigateGroup(-1);
        if (e.key === 'ArrowRight') navigateGroup(1);
        // Enter backs out of the sub-pieces to the main works view, remembering
        // this project so Enter can jump straight back into it.
        if (e.key === 'Enter' && !onControl) { e.preventDefault(); lastGroupName = currentGroup.name; closeGroup(); }
      } else {
        // On the main works view, Enter jumps back into the most recent project.
        if (e.key === 'Enter' && !onControl && lastGroupName) {
          const g = getGroups().find(x => x.name === lastGroupName);
          if (g) { e.preventDefault(); currentGroup = g; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
        }
      }
    });
  </script>
</body>
</html>
