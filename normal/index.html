<title>Normal Baker — Miki Butler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  /* Same dark studio-tool identity as the UV Toolkit / Noise Forge — one family. */
  :root{
    color-scheme:dark;
    --bg:#0f1316; --surface:#161b1f; --surface-2:#1c2228; --border:#28303a; --border-2:#39434f;
    --fg:#e8edf1; --mut:#8d97a3; --faint:#5f6974;
    --accent:#2dd4bf; --accent-2:#5ee7d6; --on-accent:#05211d; --accent-soft:#2dd4bf22;
    --good:#4ade80; --warn:#fbbf24; --bad:#f87171;
    --radius:14px; --shadow:0 2px 12px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{ margin:0; background:var(--bg); color:var(--fg); font-family:"Manrope",system-ui,-apple-system,sans-serif;
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; padding:22px 16px; padding-block:22px; }
  .mono{ font-family:"JetBrains Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums; }
  button{ font-family:inherit; cursor:pointer; color:inherit; }
  .wrap{ max-width:980px; margin:0 auto; }
  header.top{ display:flex; align-items:center; gap:12px; margin-bottom:16px; }
  .glyph{ width:38px; height:38px; border-radius:10px; flex:none; border:1px solid var(--border-2); box-shadow:var(--shadow);
    background:linear-gradient(135deg,#8ea0ff 0%,#7a86ff 48%,#aef0e4 100%); }
  .top h1{ font-size:19px; font-weight:800; margin:0; letter-spacing:-.3px; }
  .top .sub{ font-size:12px; color:var(--mut); font-weight:600; }

  .grid{ display:grid; grid-template-columns:300px 1fr; gap:16px; align-items:start; }
  @media (max-width:760px){ .grid{ grid-template-columns:1fr; } }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow); min-width:0; }
  .card h2{ font-size:12px; font-weight:800; margin:0 0 14px; text-transform:uppercase; letter-spacing:.5px; color:var(--mut); }

  .drop{ display:flex; flex-direction:column; align-items:center; gap:5px; border:2px dashed var(--border-2); border-radius:12px;
    padding:20px 14px; text-align:center; color:var(--mut); cursor:pointer; background:var(--surface-2); margin-bottom:12px; font-size:12.5px; }
  .drop.hover{ border-color:var(--accent); color:var(--accent-2); background:var(--accent-soft); }
  .drop .big{ font-size:24px; } .drop b{ color:var(--fg); } .drop .note{ font-size:10.5px; color:var(--faint); }
  .samples{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
  .pill{ font:600 11.5px/1 inherit; padding:7px 11px; border-radius:999px; border:1px solid var(--border); background:var(--surface-2); color:var(--mut); }
  .pill:hover{ border-color:var(--accent); color:var(--accent-2); }

  .field{ margin-bottom:14px; }
  .field > label{ display:flex; justify-content:space-between; align-items:baseline; font-size:12px; font-weight:700; margin-bottom:6px; }
  .field .val{ color:var(--accent-2); font-family:"JetBrains Mono",monospace; font-size:12px; }
  input[type=range]{ width:100%; accent-color:var(--accent); }
  .seg{ display:flex; gap:6px; }
  .seg button{ flex:1; padding:8px 6px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2); color:var(--mut); font-weight:700; font-size:12.5px; }
  .seg button.on{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent-2); }
  .chk{ display:flex; align-items:center; gap:9px; font-size:13px; font-weight:700; cursor:pointer; margin-bottom:12px; }
  .chk input{ width:18px; height:18px; accent-color:var(--accent); }
  .btn{ font:800 13px/1 inherit; padding:11px 14px; border-radius:9px; border:1px solid var(--border-2); background:var(--surface-2); color:var(--fg); width:100%; }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--on-accent); } .btn.primary:hover{ filter:brightness(1.06); }
  .divider{ height:1px; background:var(--border); margin:16px 0; }

  .stage{ position:relative; width:100%; aspect-ratio:1; border:1px solid var(--border-2); border-radius:10px; overflow:hidden; background:#0b0e10; }
  #view{ width:100%; height:100%; display:block; }
  #sphere{ position:absolute; inset:0; width:100%; height:100%; display:block; cursor:grab; touch-action:none; }
  #sphere.grab{ cursor:grabbing; }
  .badge{ position:absolute; left:10px; top:10px; font:700 11px/1 "JetBrains Mono",monospace; color:var(--accent-2);
    background:#0b0e10cc; border:1px solid var(--border-2); border-radius:999px; padding:5px 10px; }
  .lighthint{ position:absolute; right:10px; bottom:10px; font:700 10.5px/1 "JetBrains Mono",monospace; color:var(--faint); background:#0b0e10aa; padding:4px 8px; border-radius:6px; }
  .modes{ display:flex; gap:6px; margin-bottom:12px; }
  .status{ font-size:11.5px; color:var(--mut); min-height:14px; margin-top:8px; }
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="glyph"></div>
    <div><h1>Normal Baker</h1><div class="sub">Height map → tangent-space normal map</div></div>
  </header>

  <div class="grid">
    <div class="card">
      <h2>Source height map</h2>
      <label class="drop" id="drop">
        <span class="big">⛰️</span>
        <span class="dropmsg"><b>Drop a height map</b> or tap to choose</span>
        <span class="note">grayscale image · stays on your device</span>
        <input type="file" id="file" accept="image/*" hidden>
      </label>
      <div class="samples">
        <span style="font-size:11px;color:var(--faint);font-weight:700;align-self:center">Try:</span>
        <button class="pill" data-s="bricks">🧱 Bricks</button>
        <button class="pill" data-s="noise">🌫️ Noise</button>
        <button class="pill" data-s="rivets">⚙️ Rivets</button>
      </div>

      <div class="divider"></div>
      <h2>Settings</h2>
      <div class="field"><label>Strength <span class="val" id="vStr">2.0</span></label><input type="range" id="str" min="0.1" max="8" step="0.1" value="2"></div>
      <div class="field"><label>Smooth <span class="val" id="vBlur">0 px</span></label><input type="range" id="blur" min="0" max="6" step="1" value="0"></div>
      <div class="field">
        <label>Green channel</label>
        <div class="seg" id="green">
          <button data-v="gl" class="on">OpenGL +Y</button>
          <button data-v="dx">DirectX −Y</button>
        </div>
      </div>
      <label class="chk"><input type="checkbox" id="invert"> Invert height (white = low)</label>
      <label class="chk"><input type="checkbox" id="wrap" checked> Tileable edges (wrap)</label>

      <div class="divider"></div>
      <button class="btn primary" id="exp">⬇ Export normal map</button>
      <button class="btn" id="lib" style="margin-top:8px">＋ Send to Library</button>
      <div class="status" id="status"></div>

      <div class="divider"></div>
      <h2>3D sphere material</h2>
      <div class="field"><label>Roughness <span class="val" id="vRough">0.50</span></label><input type="range" id="rough" min="0" max="1" step="0.02" value="0.5"></div>
      <div class="field"><label>Metalness <span class="val" id="vMetal">0.10</span></label><input type="range" id="metal" min="0" max="1" step="0.02" value="0.1"></div>
      <div class="field"><label>Relief (displace) <span class="val" id="vRelief">0.00</span></label><input type="range" id="relief" min="0" max="0.5" step="0.01" value="0"></div>
    </div>

    <div class="card">
      <div class="modes">
        <div class="seg" id="mode" style="flex:1">
          <button data-v="normal" class="on">Normal</button>
          <button data-v="height">Height</button>
          <button data-v="lit">Lit</button>
          <button data-v="sphere">Sphere</button>
        </div>
      </div>
      <div class="stage">
        <canvas id="view" width="640" height="640"></canvas>
        <canvas id="sphere" hidden></canvas>
        <span class="badge" id="badge">normal</span>
        <span class="lighthint" id="lhint" hidden>drag to move the light</span>
      </div>
      <div class="status" id="dims"></div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id);};
  var MAXDIM=1600;
  var S={ str:2, blur:0, green:"gl", invert:false, wrap:true, mode:"normal",
          rough:0.5, metal:0.1, relief:0 };

  var W=0,H=0, height=null, nx=null,ny=null,nz=null, normalRGBA=null;
  var src=document.createElement("canvas"), sctx=src.getContext("2d");
  var off=document.createElement("canvas"), octx=off.getContext("2d"); // full-res offscreen for putImageData
  var view=$("view"), vctx=view.getContext("2d");
  var normCanvas=document.createElement("canvas"), nctx=normCanvas.getContext("2d"); // always holds the normal map, for the 3D sphere texture
  var heightCanvas=document.createElement("canvas"), hctx=heightCanvas.getContext("2d"); // grayscale height, for sphere displacement
  var sph=null; // three.js sphere preview state
  var light={ az:2.3, el:0.9 };

  // ---------- load image / samples ----------
  function setSource(img){
    var w=img.width,h=img.height, sc=Math.min(1, MAXDIM/Math.max(w,h));
    W=Math.max(2,Math.round(w*sc)); H=Math.max(2,Math.round(h*sc));
    src.width=W; src.height=H; sctx.drawImage(img,0,0,W,H);
    off.width=W; off.height=H;
    computeHeight(); computeNormal(); render();
    $("dims").textContent=W+" × "+H+" px"+(sc<1?" (downscaled from "+w+"×"+h+")":"");
  }
  var srcName="bricks";
  function loadFile(f){ srcName=(f.name||"map").replace(/\.[^.]+$/,""); var img=new Image(); img.onload=function(){ setSource(img); }; img.src=URL.createObjectURL(f); }

  function computeHeight(){
    var d=sctx.getImageData(0,0,W,H).data, n=W*H, base=new Float32Array(n);
    for(var i=0;i<n;i++){ var o=i*4; var l=(0.299*d[o]+0.587*d[o+1]+0.114*d[o+2])/255; base[i]=S.invert?1-l:l; }
    if(S.blur>0){ base=boxBlur(base,W,H,S.blur); }
    height=base;
    heightCanvas.width=W; heightCanvas.height=H;
    var hd=hctx.createImageData(W,H), hdd=hd.data;
    for(var i2=0;i2<n;i2++){ var c=height[i2]*255, o=i2*4; hdd[o]=hdd[o+1]=hdd[o+2]=c; hdd[o+3]=255; }
    hctx.putImageData(hd,0,0);
    if(sph&&sph.heightTex) sph.heightTex.needsUpdate=true;
  }
  function boxBlur(a,w,h,r){ var tmp=new Float32Array(w*h), out=new Float32Array(w*h), d=2*r+1;
    for(var y=0;y<h;y++){ var s=0; for(var x=-r;x<=r;x++) s+=a[y*w+Math.max(0,Math.min(w-1,x))];
      for(var x2=0;x2<w;x2++){ tmp[y*w+x2]=s/d; var add=Math.min(w-1,x2+r+1), sub=Math.max(0,x2-r); s+=a[y*w+add]-a[y*w+sub]; } }
    for(var x3=0;x3<w;x3++){ var s2=0; for(var y2=-r;y2<=r;y2++) s2+=tmp[Math.max(0,Math.min(h-1,y2))*w+x3];
      for(var y3=0;y3<h;y3++){ out[y3*w+x3]=s2/d; var add2=Math.min(h-1,y3+r+1), sub2=Math.max(0,y3-r); s2+=tmp[add2*w+x3]-tmp[sub2*w+x3]; } }
    return out;
  }
  function computeNormal(){
    var n=W*H; nx=new Float32Array(n); ny=new Float32Array(n); nz=new Float32Array(n); normalRGBA=new Uint8ClampedArray(n*4);
    var str=S.str, gy=(S.green==="dx")?-1:1, wrap=S.wrap;
    function H2(x,y){ if(wrap){ x=(x+W)%W; y=(y+H)%H; } else { x=x<0?0:x>=W?W-1:x; y=y<0?0:y>=H?H-1:y; } return height[y*W+x]; }
    for(var y=0;y<H;y++)for(var x=0;x<W;x++){
      var tl=H2(x-1,y-1),tc=H2(x,y-1),tr=H2(x+1,y-1),ml=H2(x-1,y),mr=H2(x+1,y),bl=H2(x-1,y+1),bc=H2(x,y+1),br=H2(x+1,y+1);
      var dx=(tr+2*mr+br)-(tl+2*ml+bl), dy=(bl+2*bc+br)-(tl+2*tc+tr);
      var vx=-dx*str, vy=-dy*str*gy, vz=1, inv=1/Math.sqrt(vx*vx+vy*vy+1);
      vx*=inv; vy*=inv; vz*=inv; var i=y*W+x;
      nx[i]=vx; ny[i]=vy; nz[i]=vz; var o=i*4;
      normalRGBA[o]=(vx*0.5+0.5)*255; normalRGBA[o+1]=(vy*0.5+0.5)*255; normalRGBA[o+2]=(vz*0.5+0.5)*255; normalRGBA[o+3]=255;
    }
    normCanvas.width=W; normCanvas.height=H; nctx.putImageData(new ImageData(normalRGBA,W,H),0,0);
    if(sph){ sph.tex.needsUpdate=true; }
  }
  function render(){
    if(!height){ return; }
    var isSphere=(S.mode==="sphere");
    $("sphere").hidden=!isSphere; $("view").hidden=isSphere;
    $("badge").textContent=S.mode; $("lhint").hidden=(S.mode!=="lit"&&!isSphere);
    if(isSphere){ $("lhint").textContent="drag to spin the sphere"; initSphere();
      if(sph){ sph.tex.needsUpdate=true; sphereResize(); if(!sph.running){ sph.running=true; requestAnimationFrame(sphereLoop); } } return; }
    $("lhint").textContent="drag to move the light";
    if(sph) sph.running=false;
    var img;
    if(S.mode==="normal"){ img=new ImageData(normalRGBA,W,H); }
    else if(S.mode==="height"){ var d=new Uint8ClampedArray(W*H*4); for(var i=0;i<W*H;i++){ var c=height[i]*255,o=i*4; d[o]=d[o+1]=d[o+2]=c; d[o+3]=255; } img=new ImageData(d,W,H); }
    else { img=litImage(); }
    octx.putImageData(img,0,0);
    // draw fit into square view, preserve aspect
    vctx.fillStyle="#0b0e10"; vctx.fillRect(0,0,view.width,view.height);
    vctx.imageSmoothingEnabled=true;
    var sc=Math.min(view.width/W, view.height/H), dw=W*sc, dh=H*sc;
    vctx.drawImage(off,(view.width-dw)/2,(view.height-dh)/2,dw,dh);
  }
  // ---------- 3D sphere preview (normal map on a lit material ball) ----------
  function initSphere(){
    if(sph || !window.THREE) return;
    var c=$("sphere");
    var rnd=new THREE.WebGLRenderer({canvas:c,antialias:true,alpha:true});
    rnd.setPixelRatio(Math.min(devicePixelRatio||1,2));
    var scene=new THREE.Scene();
    var cam=new THREE.PerspectiveCamera(32,1,0.1,100); cam.position.set(0,0,4.4);
    var tex=new THREE.CanvasTexture(normCanvas); tex.wrapS=tex.wrapT=THREE.RepeatWrapping;
    tex.anisotropy=rnd.capabilities.getMaxAnisotropy?rnd.capabilities.getMaxAnisotropy():1;
    var hTex=new THREE.CanvasTexture(heightCanvas); hTex.wrapS=hTex.wrapT=THREE.RepeatWrapping;
    // procedural studio environment so metal/roughness read realistically
    var envC=document.createElement("canvas"); envC.width=512; envC.height=256; var eg=envC.getContext("2d");
    var sky=eg.createLinearGradient(0,0,0,256); sky.addColorStop(0,"#dfeaf5"); sky.addColorStop(0.5,"#7f8a98"); sky.addColorStop(1,"#14181f");
    eg.fillStyle=sky; eg.fillRect(0,0,512,256);
    var kl=eg.createRadialGradient(150,70,2,150,70,90); kl.addColorStop(0,"#ffffff"); kl.addColorStop(1,"rgba(255,255,255,0)");
    eg.fillStyle=kl; eg.fillRect(0,0,512,256);
    var envTex=new THREE.CanvasTexture(envC); envTex.mapping=THREE.EquirectangularReflectionMapping;
    var pmrem=new THREE.PMREMGenerator(rnd); pmrem.compileEquirectangularShader();
    var envRT=pmrem.fromEquirectangular(envTex); scene.environment=envRT.texture; envTex.dispose(); pmrem.dispose();
    var mat=new THREE.MeshStandardMaterial({color:0xb9bec7, roughness:S.rough, metalness:S.metal,
      normalMap:tex, normalScale:new THREE.Vector2(1,1), displacementMap:hTex, displacementScale:S.relief, displacementBias:-S.relief*0.5, envMapIntensity:1});
    var mesh=new THREE.Mesh(new THREE.SphereGeometry(1.35,200,140),mat); scene.add(mesh);
    scene.add(new THREE.AmbientLight(0x3b434d,0.7));
    var key=new THREE.DirectionalLight(0xfff2e0,1.1); key.position.set(-3,4,3.5); scene.add(key);
    var rim=new THREE.DirectionalLight(0x6fb8ff,0.5); rim.position.set(3.5,-1,-2); scene.add(rim);
    sph={renderer:rnd,scene:scene,cam:cam,mesh:mesh,mat:mat,tex:tex,heightTex:hTex, rx:0.1,ry:0.4,trx:0.1,try_:0.4, running:false};
    var dr=false,lx=0,ly=0;
    c.addEventListener("pointerdown",function(e){ dr=true; c.classList.add("grab"); lx=e.clientX; ly=e.clientY; });
    window.addEventListener("pointermove",function(e){ if(!dr)return; sph.try_-=(e.clientX-lx)*0.01; sph.trx-=(e.clientY-ly)*0.01;
      sph.trx=Math.max(-1.3,Math.min(1.3,sph.trx)); lx=e.clientX; ly=e.clientY; });
    window.addEventListener("pointerup",function(){ dr=false; c.classList.remove("grab"); });
  }
  function sphereResize(){ if(!sph)return; var r=$("sphere").getBoundingClientRect(); var w=Math.max(2,r.width|0), h=Math.max(2,r.height|0);
    sph.renderer.setSize(w,h,false); sph.cam.aspect=w/h; sph.cam.updateProjectionMatrix(); }
  function sphereLoop(){ if(!sph||!sph.running)return;
    sph.try_+=0.0016; // gentle auto-spin
    sph.rx+=(sph.trx-sph.rx)*0.1; sph.ry+=(sph.try_-sph.ry)*0.1;
    sph.mesh.rotation.set(sph.rx,sph.ry,0);
    sph.renderer.render(sph.scene,sph.cam); requestAnimationFrame(sphereLoop); }

  function litImage(){
    var lx=Math.cos(light.az)*Math.cos(light.el), ly=Math.sin(light.az)*Math.cos(light.el), lz=Math.sin(light.el);
    var d=new Uint8ClampedArray(W*H*4), amb=0.22;
    for(var i=0;i<W*H;i++){ var diff=nx[i]*lx+ny[i]*ly+nz[i]*lz; if(diff<0)diff=0;
      var v=(amb+diff*0.95); if(v>1)v=1; var c=v*255, o=i*4;
      d[o]=c*0.92; d[o+1]=c*0.95; d[o+2]=c; d[o+3]=255; }
    return new ImageData(d,W,H);
  }

  // ---------- samples ----------
  function sampleCanvas(kind){
    var c=document.createElement("canvas"); c.width=c.height=512; var g=c.getContext("2d");
    if(kind==="noise"){ var im=g.createImageData(512,512), dd=im.data;
      // value-ish noise via smoothed random
      var grid=24, rnd=[]; for(var i=0;i<(grid+1)*(grid+1);i++) rnd.push(Math.random());
      function at(gx,gy){ return rnd[gy*(grid+1)+gx]; }
      for(var y=0;y<512;y++)for(var x=0;x<512;x++){ var fx=x/512*grid, fy=y/512*grid, x0=fx|0,y0=fy|0,tx=fx-x0,ty=fy-y0;
        function sm(t){return t*t*(3-2*t);} var a=at(x0,y0),b=at(x0+1,y0),cc=at(x0,y0+1),dd2=at(x0+1,y0+1);
        var top=a+(b-a)*sm(tx), bot=cc+(dd2-cc)*sm(tx), v=(top+(bot-top)*sm(ty))*255, o=(y*512+x)*4;
        dd[o]=dd[o+1]=dd[o+2]=v; dd[o+3]=255; } g.putImageData(im,0,0);
    } else if(kind==="rivets"){ g.fillStyle="#4a4a4a"; g.fillRect(0,0,512,512);
      for(var ry=0;ry<512;ry+=64)for(var rx=0;rx<512;rx+=64){ var cx=rx+32,cy=ry+32;
        var rg=g.createRadialGradient(cx-6,cy-6,1,cx,cy,22); rg.addColorStop(0,"#ffffff"); rg.addColorStop(0.7,"#9a9a9a"); rg.addColorStop(1,"#3a3a3a");
        g.fillStyle=rg; g.beginPath(); g.arc(cx,cy,20,0,6.3); g.fill(); }
    } else { // bricks
      g.fillStyle="#2a2a2a"; g.fillRect(0,0,512,512); // mortar (low)
      var bw=120,bh=56,mp=8;
      for(var row=0,yy=0;yy<512;yy+=bh+mp,row++){ var offx=(row%2)?-(bw/2):0;
        for(var xx=offx;xx<512;xx+=bw+mp){ var gx=g.createLinearGradient(xx,yy,xx,yy+bh);
          gx.addColorStop(0,"#d8d8d8"); gx.addColorStop(0.5,"#bdbdbd"); gx.addColorStop(1,"#8f8f8f");
          g.fillStyle=gx; roundRect(g,xx+2,yy+2,bw-4,bh-4,7); g.fill(); } }
    }
    return c;
  }
  function roundRect(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
  function loadSample(kind){ srcName=kind; var c=sampleCanvas(kind); var img=new Image(); img.onload=function(){ setSource(img); }; img.src=c.toDataURL(); }

  // ---------- wiring ----------
  function sl(id,key,fmt,el,after){ var i=$(id),o=$(el);
    i.addEventListener("input",function(){ S[key]=parseFloat(i.value); if(o)o.textContent=fmt(S[key]); if(after)after(); if(height){ computeNormal(); render(); } });
  }
  sl("str","str",function(v){return v.toFixed(1);},"vStr");
  sl("blur","blur",function(v){return v+" px";},"vBlur",function(){ if(height) computeHeight(); });
  // sphere-only material sliders (don't rebuild the 2D maps)
  function applyMat(){ if(!sph)return; sph.mat.roughness=S.rough; sph.mat.metalness=S.metal;
    sph.mat.displacementScale=S.relief; sph.mat.displacementBias=-S.relief*0.5; }
  function matsl(id,key,el){ var i=$(id),o=$(el);
    i.addEventListener("input",function(){ S[key]=parseFloat(i.value); if(o)o.textContent=S[key].toFixed(2); applyMat(); }); }
  matsl("rough","rough","vRough"); matsl("metal","metal","vMetal"); matsl("relief","relief","vRelief");
  $("invert").addEventListener("change",function(){ S.invert=this.checked; if(height){ computeHeight(); computeNormal(); render(); } });
  $("wrap").addEventListener("change",function(){ S.wrap=this.checked; if(height){ computeNormal(); render(); } });
  function seg(id,key,after){ document.querySelectorAll("#"+id+" button").forEach(function(b){ b.addEventListener("click",function(){
    document.querySelectorAll("#"+id+" button").forEach(function(x){x.classList.remove("on");}); b.classList.add("on"); S[key]=b.dataset.v; if(after)after(); }); }); }
  seg("green","green",function(){ if(height){ computeNormal(); render(); } });
  seg("mode","mode",function(){ render(); });

  // upload
  var drop=$("drop"), file=$("file");
  drop.addEventListener("click",function(){ file.click(); });
  file.addEventListener("change",function(){ if(file.files&&file.files[0]) loadFile(file.files[0]); });
  ["dragenter","dragover"].forEach(function(e){ drop.addEventListener(e,function(ev){ ev.preventDefault(); drop.classList.add("hover"); }); });
  ["dragleave","drop"].forEach(function(e){ drop.addEventListener(e,function(ev){ ev.preventDefault(); if(e==="dragleave") drop.classList.remove("hover"); }); });
  drop.addEventListener("drop",function(ev){ drop.classList.remove("hover"); var f=ev.dataTransfer&&ev.dataTransfer.files&&ev.dataTransfer.files[0]; if(f) loadFile(f); });
  document.querySelectorAll(".samples .pill").forEach(function(b){ b.addEventListener("click",function(){ loadSample(b.dataset.s); }); });

  // light drag (lit mode)
  var ldrag=false;
  function setLight(e){ var r=view.getBoundingClientRect(), p=e.touches?e.touches[0]:e;
    var u=((p.clientX-r.left)/r.width)*2-1, v=((p.clientY-r.top)/r.height)*2-1;
    var m=Math.min(1,Math.hypot(u,v)); light.az=Math.atan2(-v,u); light.el=(1-m)*1.4+0.12; render(); }
  view.addEventListener("pointerdown",function(e){ if(S.mode!=="lit")return; ldrag=true; setLight(e); });
  window.addEventListener("pointermove",function(e){ if(ldrag) setLight(e); });
  window.addEventListener("pointerup",function(){ ldrag=false; });

  // export
  function saveBlob(blob,name){ if(window.__dl){ window.__dl.save({filename:name,data:blob}).then(function(){ $("status").textContent="Saved "+name; }).catch(function(){ $("status").textContent="Save cancelled."; }); return; }
    var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1500); $("status").textContent="Saved "+name; }
  $("exp").addEventListener("click",function(){ if(!normalRGBA){ $("status").textContent="Load a height map first."; return; }
    off.width=W; off.height=H; octx.putImageData(new ImageData(normalRGBA,W,H),0,0);
    off.toBlob(function(b){ if(b) saveBlob(b,slug(normalName())+"-"+W+"px.png"); },"image/png"); });
  try{ if(window.claude&&claude.use){ claude.use("downloads").then(function(d){ window.__dl=d; }).catch(function(){}); } }catch(e){}

  // ---------- Texture Library (shared IndexedDB on this origin) ----------
  var MBLib=(function(){ var DB="mbTextureLib",STORE="items",_db=null;
    function open(){return new Promise(function(res,rej){ if(_db)return res(_db); var r=indexedDB.open(DB,1);
      r.onupgradeneeded=function(e){var db=e.target.result; if(!db.objectStoreNames.contains(STORE)){var s=db.createObjectStore(STORE,{keyPath:"id"}); s.createIndex("created","created");}};
      r.onsuccess=function(){_db=r.result;res(_db);}; r.onerror=function(){rej(r.error);}; });}
    return { add:function(it){ return open().then(function(db){ return new Promise(function(res,rej){ var r=db.transaction(STORE,"readwrite").objectStore(STORE).add(it); r.onsuccess=function(){res();}; r.onerror=function(){rej(r.error);}; }); }); } }; })();
  function mbToast(msg,bad){ var t=document.getElementById("mbToast"); if(!t){ t=document.createElement("div"); t.id="mbToast";
    t.style.cssText="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:50;font:800 13px/1 Manrope,sans-serif;padding:11px 16px;border-radius:999px;box-shadow:0 8px 30px #0008;transition:opacity .3s;color:#fff;"; document.body.appendChild(t); }
    t.textContent=msg; t.style.background=bad?"#7f1d1d":"#0d9488"; t.style.opacity="1"; clearTimeout(t._h); t._h=setTimeout(function(){ t.style.opacity="0"; },1800); }
  function mbThumb(cv,size){ var r=cv.width/cv.height, tw=r>=1?size:Math.round(size*r), th=r>=1?Math.round(size/r):size;
    var c=document.createElement("canvas"); c.width=tw; c.height=th; c.getContext("2d").drawImage(cv,0,0,tw,th); return c.toDataURL("image/png"); }
  function slug(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,""); }
  function titleCase(s){ return (s||"map").replace(/[-_]+/g," ").replace(/\s+/g," ").trim().replace(/\b\w/g,function(m){return m.toUpperCase();}); }
  function normalName(){ var n=titleCase(srcName); if(!/normal/i.test(n)) n+=" Normal Map"; return n; }
  $("lib").addEventListener("click",function(){ if(!normalRGBA){ $("status").textContent="Load a height map first."; return; }
    var cv=normCanvas, thumb=mbThumb(cv,160);
    cv.toBlob(function(blob){ if(!blob){ mbToast("Couldn't save",1); return; }
      MBLib.add({ id:Date.now()+"-"+((Math.random()*1e6)|0), name:normalName(), kind:"normal", w:cv.width, h:cv.height, blob:blob, thumb:thumb, created:new Date().toISOString(), meta:"source:"+srcName+" strength:"+S.str+" green:"+S.green })
        .then(function(){ mbToast("Sent to Library ✓"); }).catch(function(){ mbToast("Library save failed",1); }); },"image/png"); });
  if(window.claude&&window.claude.use) $("lib").hidden=true;

  window.addEventListener("resize",function(){ sphereResize(); });
  loadSample("bricks");
})();
</script>
</body>
