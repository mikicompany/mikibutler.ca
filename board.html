<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="96x96" href="images/favicon-96.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="images/favicon-48.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16.png" />

  <title>Shot Board — Miki Butler</title>
  <meta name="description" content="A ShotGrid-style production tracker for Miki Butler's projects." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap">
  <style>
    :root{
      --accent:#a0ff00;
      --bg:#0f1113; --panel:#15181c; --card:#1b1f25; --line:#23272e; --line2:#2f3540;
      --fg:#e7e9ee; --mut:#8a9099; --faint:#666d78;
      --wtg:#7a828e; --rdy:#4b93d6; --ip:#e0b53f; --rev:#e07d3a; --fin:#7bc62d;
      --p-low:#7a828e; --p-medium:#d6a516; --p-high:#e0783a; --p-urgent:#e0453d;
      color-scheme:dark;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:var(--bg);color:var(--fg);
      font-family:'Inter','Helvetica Neue',Arial,sans-serif;font-size:14px;line-height:1.45;
      -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
    .mono{font-family:'JetBrains Mono',ui-monospace,monospace}
    button{font-family:inherit;cursor:pointer}
    a{color:inherit}

    /* ---- app bar ---- */
    .app-bar{display:flex;align-items:center;gap:13px;padding:11px 18px;
      padding-top:calc(11px + env(safe-area-inset-top,0px));
      background:var(--panel);border-bottom:1px solid var(--line);flex:none}
    .home{display:flex;align-items:center;flex:none;border-radius:9px;overflow:hidden;width:34px;height:34px;
      border:1px solid var(--line);background:#000}
    .home img{width:100%;height:100%;object-fit:cover;display:block}
    .titles h1{margin:0;font-size:16px;font-weight:800;letter-spacing:-.2px}
    .titles span{font-size:11.5px;color:var(--mut);font-weight:600}
    .app-bar .sp{flex:1}
    .count{font-size:12px;color:var(--mut);white-space:nowrap}
    .pb-btn{font:700 12.5px/1 inherit;padding:9px 13px;border-radius:9px;border:1px solid transparent;
      background:var(--accent);color:#0a0b08}
    .pb-btn:hover{filter:brightness(1.06)}
    .pb-btn.ghost{background:none;border-color:var(--line);color:var(--fg)}
    .pb-btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
    .pb-link{background:none;border:0;color:var(--accent);font:700 12.5px/1 inherit;padding:6px 4px}
    .pb-link:hover{text-decoration:underline}

    /* ---- board ---- */
    .pb-scroll{flex:1;min-height:0;overflow-x:auto;overflow-y:hidden;padding:18px}
    .pb-board{display:flex;gap:14px;align-items:flex-start;height:100%;min-width:min-content}
    .pb-col{flex:0 0 260px;width:260px;max-height:100%;background:var(--panel);border:1px solid var(--line);
      border-radius:12px;display:flex;flex-direction:column;min-height:0}
    .pb-col.drop{border-color:var(--accent);box-shadow:0 0 0 2px rgba(160,255,0,.28) inset}
    .pb-col-head{display:flex;align-items:center;gap:8px;padding:12px 13px 9px}
    .pb-code{font:700 10px/1 'JetBrains Mono',monospace;letter-spacing:.06em;text-transform:uppercase;
      color:#0a0b08;background:var(--cc);padding:3px 7px;border-radius:5px}
    .pb-col-name{font-size:12.5px;font-weight:700}
    .pb-col-head .n{margin-left:auto;font-size:11px;color:var(--mut);background:#0b0d10;border:1px solid var(--line);
      border-radius:999px;padding:1px 8px;min-width:22px;text-align:center}
    .pb-list{flex:1;overflow-y:auto;padding:2px 10px 10px;display:flex;flex-direction:column;gap:9px;min-height:40px}
    .pb-card{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--sc,var(--line2));
      border-radius:10px;overflow:hidden;cursor:grab;outline:none}
    .pb-card:hover{border-color:var(--line2);border-left-color:var(--sc,var(--line2))}
    .pb-card:focus-visible{box-shadow:0 0 0 2px var(--accent)}
    .pb-card.dragging{opacity:.4;cursor:grabbing}
    .pb-thumb{aspect-ratio:16/9;background:#0b0d10 center/cover no-repeat;display:flex;align-items:center;
      justify-content:center;color:var(--faint);font-size:22px;border-bottom:1px solid var(--line)}
    .pb-body{padding:10px 11px}
    .pb-name{font-size:13.5px;font-weight:600;line-height:1.32;word-break:break-word}
    .pb-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px}
    .pb-tag{font:700 9.5px/1 inherit;text-transform:uppercase;letter-spacing:.3px;padding:3px 7px;border-radius:5px;
      background:#0b0d10;border:1px solid var(--line);color:var(--mut)}
    .pb-tag.kind{color:var(--accent);border-color:rgba(160,255,0,.3)}
    .pb-tag.demo{color:var(--faint)}
    .pb-foot{display:flex;align-items:center;gap:7px;margin-top:9px}
    .pb-pri{width:9px;height:9px;border-radius:50%;flex:none;background:var(--pc)}
    .pb-foot .sp{flex:1}
    .pb-who{font:700 10px/1 'JetBrains Mono',monospace;color:#0a0b08;background:var(--accent);width:23px;height:23px;
      border-radius:50%;display:grid;place-items:center}
    .pb-drop{height:2px;background:var(--accent);border-radius:2px;margin:1px 2px}
    .pb-add{margin:2px 10px 11px;padding:8px;border:1px dashed var(--line2);border-radius:8px;background:none;
      color:var(--mut);font:600 12.5px/1 inherit;text-align:left}
    .pb-add:hover{color:var(--fg);border-color:var(--accent)}
    .pb-empty{padding:14px 4px;text-align:center;color:var(--faint);font-size:11.5px}

    /* ---- modal ---- */
    .pb-overlay{position:fixed;inset:0;z-index:50;background:rgba(6,8,11,.62);display:flex;align-items:flex-start;
      justify-content:center;padding:24px 16px;overflow-y:auto;backdrop-filter:blur(2px)}
    .pb-overlay[hidden]{display:none!important}
    .pb-modal{width:100%;max-width:430px;margin-top:min(8vh,58px);background:var(--panel);border:1px solid var(--line2);
      border-radius:16px;box-shadow:0 22px 54px rgba(0,0,0,.6);padding:20px;display:flex;flex-direction:column;gap:13px}
    .pb-modal h3{margin:0;font-size:16px;font-weight:800}
    .pb-f{display:flex;flex-direction:column;gap:6px}
    .pb-f label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--mut)}
    .pb-f input,.pb-f select,.pb-f textarea{font:14px/1.4 inherit;color:var(--fg);background:#0b0d10;
      border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%}
    .pb-f input:focus,.pb-f select:focus,.pb-f textarea:focus{outline:none;border-color:var(--accent);
      box-shadow:0 0 0 2px rgba(160,255,0,.14)}
    .pb-f textarea{resize:vertical;min-height:62px}
    .pb-row{display:flex;gap:11px}.pb-row .pb-f{flex:1}
    .pb-seg{display:flex;gap:6px;flex-wrap:wrap}
    .pb-seg button{font:600 12px/1 inherit;padding:8px 11px;border-radius:8px;border:1px solid var(--line);
      background:#0b0d10;color:var(--mut)}
    .pb-seg button.on{color:var(--fg);border-color:var(--segc,var(--accent));background:rgba(160,255,0,.05)}
    .pb-seg button .dt{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--segc)}
    .pb-acts{display:flex;align-items:center;gap:8px;margin-top:2px}.pb-acts .sp{flex:1}
    .pb-del{background:none;border:0;color:var(--p-urgent);font:700 13px/1 inherit;padding:8px 11px;border-radius:8px}
    .pb-del:hover{background:rgba(224,69,61,.12)}
    @media (max-width:560px){.pb-col{flex-basis:80vw;width:80vw}.titles span{display:none}}
    @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <header class="app-bar">
    <a class="home" href="index.html" title="Back to mikibutler.ca" aria-label="Home"><img src="images/logo512.jpg" alt="Miki Butler" /></a>
    <div class="titles"><h1>Shot Board</h1><div><span>production tracker · saved in this browser</span></div></div>
    <span class="sp"></span>
    <span class="count" id="pbCount"></span>
    <button type="button" class="pb-link" id="pbClear" hidden>Clear samples</button>
    <button type="button" class="pb-btn" id="pbNew">＋ New item</button>
  </header>

  <main class="pb-scroll"><div class="pb-board" id="pbBoard"></div></main>

  <div class="pb-overlay" id="pbOverlay" hidden>
    <div class="pb-modal" role="dialog" aria-modal="true" aria-labelledby="pbMTitle">
      <h3 id="pbMTitle">New item</h3>
      <div class="pb-f"><label for="pbName">Name</label><input id="pbName" placeholder="e.g. Queen's Throne" autocomplete="off"></div>
      <div class="pb-row">
        <div class="pb-f"><label>Entity</label><div class="pb-seg" id="pbKind"></div></div>
        <div class="pb-f"><label for="pbStep">Pipeline step</label><select id="pbStep"></select></div>
      </div>
      <div class="pb-row">
        <div class="pb-f"><label for="pbStatus">Status</label><select id="pbStatus"></select></div>
        <div class="pb-f"><label for="pbWho">Assignee</label><input id="pbWho" placeholder="initials" autocomplete="off" maxlength="4"></div>
      </div>
      <div class="pb-f"><label>Priority</label><div class="pb-seg" id="pbPrio"></div></div>
      <div class="pb-f"><label for="pbThumb">Thumbnail URL (optional)</label><input id="pbThumb" placeholder="https://…" autocomplete="off"></div>
      <div class="pb-f"><label for="pbNote">Notes</label><textarea id="pbNote" placeholder="Scope, feedback, links…"></textarea></div>
      <div class="pb-acts">
        <button type="button" class="pb-del" id="pbDel" hidden>Delete</button>
        <span class="sp"></span>
        <button type="button" class="pb-btn ghost" id="pbCancel">Cancel</button>
        <button type="button" class="pb-btn" id="pbSave">Save</button>
      </div>
    </div>
  </div>

  <script>
  (function () {
    var board = document.getElementById('pbBoard'); if (!board) return;
    var KEY = 'shotboard.v1', OLD = 'arcade.shotboard.v1';
    var STATUS = [
      { id:'wtg', name:'Waiting',     color:'var(--wtg)' },
      { id:'rdy', name:'Ready',       color:'var(--rdy)' },
      { id:'ip',  name:'In Progress', color:'var(--ip)' },
      { id:'rev', name:'Review',      color:'var(--rev)' },
      { id:'fin', name:'Final',       color:'var(--fin)' }
    ];
    var STEPS = ['Concept','Blockout','Model','UV','Texture','Lookdev','Lighting','Comp','Review'];
    var KINDS = [ {id:'asset',label:'Asset'}, {id:'shot',label:'Shot'} ];
    var PRIOS = [
      {id:'low',label:'Low',color:'var(--p-low)'}, {id:'medium',label:'Med',color:'var(--p-medium)'},
      {id:'high',label:'High',color:'var(--p-high)'}, {id:'urgent',label:'Urgent',color:'var(--p-urgent)'}
    ];
    var scolor={}, pcolor={};
    STATUS.forEach(function(s){ scolor[s.id]=s.color; });
    PRIOS.forEach(function(p){ pcolor[p.id]=p.color; });
    function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    var items = [];
    try { items = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e) { items = null; }
    if (!items) { // migrate from the old arcade tool, else seed
      try { var old = JSON.parse(localStorage.getItem(OLD) || 'null'); if (old && old.length) items = old; } catch(e) {}
    }
    if (!items) items = seed();
    if (!Array.isArray(items)) items = [];
    persist();
    function persist(){ try { localStorage.setItem(KEY, JSON.stringify(items)); } catch(e){} }
    function seed(){
      return [
        {id:'d1',name:"Queen's Throne",kind:'asset',step:'Lighting',status:'ip',priority:'high',who:'MB',thumb:'',note:'Final lighting + hero shot.',order:1,demo:true},
        {id:'d2',name:'STE Lookout',kind:'shot',step:'Lookdev',status:'rev',priority:'urgent',who:'MB',thumb:'',note:'Normal-map seam on cliff face — pending review.',order:1,demo:true},
        {id:'d3',name:'WoW-style Axe',kind:'asset',step:'Texture',status:'ip',priority:'medium',who:'MB',thumb:'',note:'Hand-painted stylized pass.',order:2,demo:true},
        {id:'d4',name:'Calaca Mat',kind:'asset',step:'Model',status:'rdy',priority:'medium',who:'MB',thumb:'',note:'',order:1,demo:true},
        {id:'d5',name:'Dark Nest',kind:'asset',step:'Blockout',status:'wtg',priority:'low',who:'',thumb:'',note:'Kickoff pending.',order:1,demo:true},
        {id:'d6',name:'PvZ Social Hub',kind:'asset',step:'Comp',status:'fin',priority:'low',who:'MB',thumb:'',note:'Shipped.',order:1,demo:true}
      ];
    }

    function byOrder(a,b){ return (a.order||0)-(b.order||0); }
    function render(){
      var demo = items.some(function(i){ return i.demo; });
      document.getElementById('pbClear').hidden = !demo;
      document.getElementById('pbCount').textContent = items.length + (items.length===1?' item':' items');
      board.innerHTML = '';
      STATUS.forEach(function(s){
        var list = items.filter(function(i){ return (i.status||'wtg')===s.id; }).sort(byOrder);
        var col = document.createElement('section'); col.className='pb-col'; col.dataset.status=s.id;
        var head=document.createElement('div'); head.className='pb-col-head';
        head.innerHTML='<span class="pb-code" style="--cc:'+s.color+'">'+s.id+'</span><span class="pb-col-name">'+s.name+'</span><span class="n">'+list.length+'</span>';
        col.appendChild(head);
        var listEl=document.createElement('div'); listEl.className='pb-list'; listEl.dataset.status=s.id;
        if(!list.length){ var e=document.createElement('div'); e.className='pb-empty'; e.textContent='Drop here'; listEl.appendChild(e); }
        list.forEach(function(it){ listEl.appendChild(card(it)); });
        wireDrop(listEl, s.id); col.appendChild(listEl);
        var add=document.createElement('button'); add.className='pb-add'; add.type='button'; add.textContent='＋ Add';
        add.onclick=function(){ openEd(null, s.id); }; col.appendChild(add);
        board.appendChild(col);
      });
    }
    function card(it){
      var el=document.createElement('div'); el.className='pb-card'; el.draggable=true; el.tabIndex=0; el.dataset.id=it.id;
      el.style.setProperty('--sc', scolor[it.status]||'var(--line2)');
      var icon = it.kind==='shot' ? '🎞️' : '📦';
      var thumb = it.thumb
        ? '<div class="pb-thumb" style="background-image:url(\''+esc(it.thumb).replace(/'/g,'%27')+'\')"></div>'
        : '<div class="pb-thumb">'+icon+'</div>';
      var who = it.who ? '<span class="pb-who">'+esc(it.who.slice(0,3).toUpperCase())+'</span>' : '';
      var demo = it.demo ? '<span class="pb-tag demo">sample</span>' : '';
      el.innerHTML = thumb +
        '<div class="pb-body">'+
          '<div class="pb-name"></div>'+
          '<div class="pb-meta"><span class="pb-tag kind">'+(it.kind==='shot'?'Shot':'Asset')+'</span><span class="pb-tag">'+esc(it.step||'—')+'</span>'+demo+'</div>'+
          '<div class="pb-foot"><span class="pb-pri" style="--pc:'+(pcolor[it.priority]||'var(--p-medium)')+'" title="'+(it.priority||'')+' priority"></span><span class="sp"></span>'+who+'</div>'+
        '</div>';
      el.querySelector('.pb-name').textContent = it.name || '(unnamed)';
      el.addEventListener('click', function(){ openEd(it, it.status); });
      el.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openEd(it, it.status); } });
      el.addEventListener('dragstart', function(e){ dragId=it.id; el.classList.add('dragging'); try{ e.dataTransfer.setData('text/plain', it.id); e.dataTransfer.effectAllowed='move'; }catch(_){}});
      el.addEventListener('dragend', function(){ el.classList.remove('dragging'); clearLine(); });
      return el;
    }

    var dragId=null, line=null;
    function clearLine(){ if(line&&line.parentNode) line.parentNode.removeChild(line); line=null;
      Array.prototype.forEach.call(document.querySelectorAll('.pb-col.drop'), function(c){ c.classList.remove('drop'); }); }
    function wireDrop(listEl, status){
      listEl.addEventListener('dragover', function(e){
        e.preventDefault(); try{ e.dataTransfer.dropEffect='move'; }catch(_){}
        listEl.closest('.pb-col').classList.add('drop');
        var after=afterCard(listEl, e.clientY);
        if(!line){ line=document.createElement('div'); line.className='pb-drop'; }
        if(after) listEl.insertBefore(line, after); else listEl.appendChild(line);
      });
      listEl.addEventListener('dragleave', function(e){ if(!listEl.contains(e.relatedTarget)) listEl.closest('.pb-col').classList.remove('drop'); });
      listEl.addEventListener('drop', function(e){
        e.preventDefault();
        var id=dragId; if(!id){ try{ id=e.dataTransfer.getData('text/plain'); }catch(_){} }
        var it=find(id); var idx=indexAt(listEl, e.clientY); clearLine(); if(!it) return;
        var col=items.filter(function(x){ return (x.status||'wtg')===status && x.id!==id; }).sort(byOrder);
        it.status=status; it.order=orderAt(col, idx); it.demo=false;
        persist(); render(); dragId=null;
      });
    }
    function afterCard(listEl, y){ var cs=Array.prototype.slice.call(listEl.querySelectorAll('.pb-card:not(.dragging)'));
      for(var i=0;i<cs.length;i++){ var r=cs[i].getBoundingClientRect(); if(y<r.top+r.height/2) return cs[i]; } return null; }
    function indexAt(listEl, y){ var cs=Array.prototype.slice.call(listEl.querySelectorAll('.pb-card:not(.dragging)'));
      for(var i=0;i<cs.length;i++){ var r=cs[i].getBoundingClientRect(); if(y<r.top+r.height/2) return i; } return cs.length; }
    function orderAt(col, idx){ if(!col.length) return 1000; if(idx<=0) return (col[0].order||0)-1;
      if(idx>=col.length) return (col[col.length-1].order||0)+1; return ((col[idx-1].order||0)+(col[idx].order||0))/2; }
    function find(id){ for(var i=0;i<items.length;i++){ if(items[i].id===id) return items[i]; } return null; }
    function maxOrder(status){ return items.filter(function(i){ return (i.status||'wtg')===status; }).reduce(function(m,i){ return Math.max(m,i.order||0); },0); }
    function uid(){ try{ return crypto.randomUUID(); }catch(e){ return 'i'+Date.now()+Math.random().toString(36).slice(2,6); } }

    // ---- editor ----
    var ov=document.getElementById('pbOverlay'), fName=document.getElementById('pbName'), fWho=document.getElementById('pbWho'),
        fThumb=document.getElementById('pbThumb'), fNote=document.getElementById('pbNote'),
        fStep=document.getElementById('pbStep'), fStatus=document.getElementById('pbStatus'),
        fDel=document.getElementById('pbDel'), mTitle=document.getElementById('pbMTitle');
    var editing=null, curKind='asset', curPrio='medium';
    STEPS.forEach(function(s){ var o=document.createElement('option'); o.value=s; o.textContent=s; fStep.appendChild(o); });
    STATUS.forEach(function(s){ var o=document.createElement('option'); o.value=s.id; o.textContent=s.name+' ('+s.id+')'; fStatus.appendChild(o); });
    seg('pbKind', KINDS.map(function(k){ return {id:k.id,label:k.label,color:'var(--accent)'}; }), function(v){ curKind=v; }, function(){ return curKind; });
    seg('pbPrio', PRIOS, function(v){ curPrio=v; }, function(){ return curPrio; });
    function seg(id, opts, set, get){ var host=document.getElementById(id); host.innerHTML='';
      opts.forEach(function(o){ var b=document.createElement('button'); b.type='button'; b.dataset.v=o.id; b.style.setProperty('--segc',o.color);
        b.innerHTML='<span class="dt"></span>'+o.label; b.onclick=function(){ set(o.id); syncSeg(host,get()); }; host.appendChild(b); }); }
    function syncSeg(host,val){ Array.prototype.forEach.call(host.children, function(b){ b.classList.toggle('on', b.dataset.v===val); }); }
    function openEd(it, status){ editing=it; curKind=it?(it.kind||'asset'):'asset'; curPrio=it?(it.priority||'medium'):'medium';
      fName.value=it?(it.name||''):''; fWho.value=it?(it.who||''):''; fThumb.value=it?(it.thumb||''):''; fNote.value=it?(it.note||''):'';
      fStep.value=it?(it.step||'Model'):'Model'; fStatus.value=it?(it.status||status||'wtg'):(status||'wtg');
      mTitle.textContent=it?'Edit item':'New item'; fDel.hidden=!it;
      syncSeg(document.getElementById('pbKind'),curKind); syncSeg(document.getElementById('pbPrio'),curPrio);
      ov.hidden=false; setTimeout(function(){ fName.focus(); },30); }
    function closeEd(){ ov.hidden=true; editing=null; }
    document.getElementById('pbNew').onclick=function(){ openEd(null,'wtg'); };
    document.getElementById('pbCancel').onclick=closeEd;
    ov.addEventListener('click', function(e){ if(e.target===ov) closeEd(); });
    document.addEventListener('keydown', function(e){ if(e.key==='Escape' && !ov.hidden) closeEd(); });
    document.getElementById('pbSave').onclick=function(){
      var name=fName.value.trim(); if(!name){ fName.focus(); fName.style.borderColor='var(--p-urgent)'; return; }
      var status=fStatus.value;
      if(editing){ editing.name=name; editing.who=fWho.value.trim(); editing.thumb=fThumb.value.trim(); editing.note=fNote.value;
        editing.step=fStep.value; editing.status=status; editing.kind=curKind; editing.priority=curPrio; editing.demo=false; }
      else { items.push({ id:uid(), name:name, kind:curKind, step:fStep.value, status:status, priority:curPrio,
        who:fWho.value.trim(), thumb:fThumb.value.trim(), note:fNote.value, order:maxOrder(status)+1 }); }
      persist(); render(); closeEd();
    };
    fDel.onclick=function(){ if(editing){ items=items.filter(function(x){ return x.id!==editing.id; }); persist(); render(); } closeEd(); };
    fName.addEventListener('input', function(){ fName.style.borderColor=''; });
    document.getElementById('pbClear').onclick=function(){ items=items.filter(function(i){ return !i.demo; }); persist(); render(); };

    render();
  })();
  </script>
</body>
</html>
