  <style>
    .slideshow {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 0;
    }

    .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 1.2s ease-in-out;
    }

    .slide.active { opacity: 1; }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      transform: scale(1.05);
      filter: brightness(0.35);
      transition: transform 8s ease-out, filter 1.2s ease-in-out;
    }

    .slide.active img {
      transform: scale(1);
      filter: brightness(1);
    }

    .slide-video {
      position: absolute;
      inset: 0;
      overflow: hidden;
      transform: scale(1.05);
      filter: brightness(0.35);
      transition: transform 8s ease-out, filter 1.2s ease-in-out;
    }

    .slide.active .slide-video {
      transform: scale(1);
      filter: brightness(1);
    }

    .slide-video-frame {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 177.78vh;
      height: 100vh;
      min-width: 100%;
      min-height: 56.25vw;
      transform: translate(-50%, -50%);
      border: 0;
      pointer-events: none;
    }

    .slide-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to right,
        rgba(0,0,0,0.55) 0%,
        rgba(0,0,0,0.1) 50%,
        transparent 100%
      );
    }

    /* Title caption bottom-right */
    .slide-caption {
      position: absolute;
      bottom: 32px;
      left: 0;
      right: 0;
      text-align: center;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.6s ease 0.8s, transform 0.6s ease 0.8s;
    }

    .slide.active .slide-caption {
      opacity: 1;
      transform: translateY(0);
    }

    .slide-caption .cap-tag {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #a0ff00;
      margin-bottom: 4px;
    }

    .slide-caption .cap-title {
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,255,255,0.7);
      letter-spacing: 0.04em;
    }

    /* Top-left project blurb — eases in from the left on the active slide */
    .slide-blurb {
      position: absolute;
      top: 14%;
      left: 210px;
      max-width: 440px;
      font-size: 23px;
      font-weight: 600;
      line-height: 1.35;
      color: #fff;
      text-shadow: 0 2px 14px rgba(0,0,0,0.75);
      opacity: 0;
      transform: translateX(-42px);
      transition: opacity 0.7s ease 0.9s, transform 0.7s cubic-bezier(0.22,1,0.36,1) 0.9s;
      pointer-events: none;
    }
    .slide.active .slide-blurb {
      opacity: 1;
      transform: translateX(0);
    }
    @media (prefers-reduced-motion: reduce) {
      .slide-blurb { transition: opacity 0.4s ease; transform: none; }
    }

    /* Dot indicators */
    .slide-dots {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 90vw;
      gap: 8px;
      z-index: 10;
    }

    .slide-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
      cursor: pointer;
      transition: background 0.3s, transform 0.3s;
      border: none;
      padding: 0;
    }

    .slide-dot.active {
      background: #a0ff00;
      transform: scale(1.4);
    }

    /* Prev/Next arrows */
    /* Logo-style circular accent arrows */
    .slide-prev,
    .slide-next {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 46px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.3);
      border: 2px solid rgba(160,255,0,0.55);
      border-radius: 50%;
      color: #a0ff00;
      font-size: 22px;
      cursor: pointer;
      z-index: 10;
      line-height: 1;
      box-shadow: 0 0 16px rgba(160,255,0,0.15);
      transition: background 0.2s, color 0.2s, border-color 0.2s, box-shadow 0.2s, transform 0.15s;
    }

    .slide-prev { left: 170px; }
    .slide-next { right: 16px; }
    .slide-prev:hover, .slide-next:hover {
      background: #a0ff00;
      color: #000;
      border-color: #a0ff00;
      box-shadow: 0 0 22px rgba(160,255,0,0.5);
    }
    .slide-prev:active, .slide-next:active { transform: translateY(-50%) scale(0.92); }

    /* Compact slide counter (shown on mobile instead of many dots) */
    .slide-counter { display: none; }

    /* Sidebar sits above slideshow */
    .sidebar { z-index: 20; }

    /* Progress bar */
    .slide-progress {
      position: fixed;
      bottom: 0;
      left: var(--sidebar-width);
      right: 0;
      height: 2px;
      background: rgba(255,255,255,0.1);
      z-index: 10;
    }

    .slide-progress-bar {
      height: 100%;
      background: #a0ff00;
      width: 0%;
      transition: width linear;
    }

    /* Slides are tappable — go to that piece on the Work page */
    .slide { cursor: pointer; }

    /* Smooth fade when leaving the home page for a piece */
    body { transition: opacity 0.28s ease; }
    body.leaving { opacity: 0; }

    @media (max-width: 768px) {
      .slide-prev { left: 10px; }
      .slide-next { right: 10px; }
      .slide-caption { bottom: 20px; left: 0; right: 0; text-align: center; }
      .slide-blurb { left: 20px; top: 84px; font-size: 16px; max-width: 72%; }
      /* Too many slides to show a dot each on a phone — use a counter */
      .slide-dots { display: none; }
      .slide-counter {
        display: block;
        position: fixed;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        font-size: 11px;
        letter-spacing: 0.12em;
        color: rgba(255,255,255,0.75);
        background: rgba(0,0,0,0.45);
        padding: 5px 12px;
        border-radius: 12px;
        font-variant-numeric: tabular-nums;
      }
    }

  <div class="slide-progress"><div class="slide-progress-bar" id="progress-bar"></div></div>

  <script src="js/sidebar.js"></script>
  <script>
    const INTERVAL = 6000;
    const CATEGORY_LABELS = {
      'starship-troopers': 'Starship Troopers',
      'dead-rising': 'Dead Rising',
      'pvz': 'Plants vs Zombies',
      'squad': 'Squad',
      'star-trek-legends': 'Star Trek Legends',
      'personal': 'Personal Work',
      'other': 'Other',
      'reel': 'Reel'
    };

    let slides = [];
    let current = 0;
    let timer = null;
    let progressTimer = null;

    fetch('data.json?t=' + Date.now()).then(r => r.json()).then(data => {
      // Filter out items with home: false
      const workSlides = data.work.filter(item => item.home !== false && !item.hidden);
      const videoSlides = (data.carousel || []).filter(item => item.video);
      slides = [...workSlides, ...videoSlides];
      buildSlideshow();
      // Defer activation one frame so a slide's blurb "from" state paints first
      // and its slide-in transition runs when that slide becomes active.
      requestAnimationFrame(() => requestAnimationFrame(() => goTo(0)));
    });

    function buildSlideshow() {
      const ss = document.getElementById('slideshow');
      const dots = document.getElementById('slide-dots');

      slides.forEach((item, i) => {
        const slide = document.createElement('div');
        slide.className = 'slide';
        const media = item.video
          ? `<div class="slide-video"><iframe class="slide-video-frame" src="https://www.youtube.com/embed/${item.video}?autoplay=1&mute=1&loop=1&playlist=${item.video}&controls=0&showinfo=0&modestbranding=1&rel=0&playsinline=1" title="${item.title}" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe></div>`
          : `<img src="${item.img}" alt="${item.title}" />`;
        slide.innerHTML = `
          ${media}
          <div class="slide-overlay"></div>
          <div class="slide-caption">
            <div class="cap-tag">${CATEGORY_LABELS[item.category] || item.category || ''}</div>
            <div class="cap-title">${item.title}</div>
          </div>
        `;
        // Tap a slide to open that piece on the Work page (with a fade-out).
        slide.addEventListener('click', () => goToWork(item));
        ss.appendChild(slide);

        const dot = document.createElement('button');
        dot.className = 'slide-dot';
        dot.addEventListener('click', () => goTo(i));
        dots.appendChild(dot);
      });
    }

    function goToWork(item) {
      let dest = 'work.html';
      if (item && item.group) {
        dest += '?group=' + encodeURIComponent(item.group);
        if (item.title) dest += '&item=' + encodeURIComponent(item.title);
      }
      document.body.classList.add('leaving');
      setTimeout(() => { window.location.href = dest; }, 260);
    }

    function goTo(index) {
      const allSlides = document.querySelectorAll('.slide');
      const allDots = document.querySelectorAll('.slide-dot');

      allSlides[current]?.classList.remove('active');
      allDots[current]?.classList.remove('active');

      current = (index + slides.length) % slides.length;

      allSlides[current]?.classList.add('active');
      allDots[current]?.classList.add('active');

      const counter = document.getElementById('slide-counter');
      if (counter) counter.textContent = (current + 1) + ' / ' + slides.length;

      startProgress();
      clearInterval(timer);
      timer = setInterval(() => goTo(current + 1), INTERVAL);
    }

    function startProgress() {
      const bar = document.getElementById('progress-bar');
      bar.style.transition = 'none';
      bar.style.width = '0%';
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          bar.style.transition = `width ${INTERVAL}ms linear`;
          bar.style.width = '100%';
        });
      });
    }

    document.getElementById('slide-prev').addEventListener('click', () => goTo(current - 1));
    document.getElementById('slide-next').addEventListener('click', () => goTo(current + 1));

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') goTo(current - 1);
      if (e.key === 'ArrowRight') goTo(current + 1);
    });
  </script>
