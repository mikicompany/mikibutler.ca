<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Lava — Blender sculpting add-on">
  <defs>
    <radialGradient id="bg" cx="50%" cy="34%" r="80%">
      <stop offset="0%" stop-color="#15130f"/><stop offset="70%" stop-color="#0b0a08"/><stop offset="100%" stop-color="#060505"/>
    </radialGradient>
    <radialGradient id="clay" cx="36%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#f6c79a"/><stop offset="30%" stop-color="#d97a3f"/><stop offset="66%" stop-color="#9a3f18"/><stop offset="100%" stop-color="#3a160a"/>
    </radialGradient>
    <radialGradient id="sheen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6ea" stop-opacity=".8"/><stop offset="100%" stop-color="#fff6ea" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000" stop-opacity=".55"/><stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0806" stop-opacity="0"/><stop offset="70%" stop-color="#0a0806" stop-opacity=".5"/><stop offset="100%" stop-color="#070504" stop-opacity=".96"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="soft2"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- viewport dot grid -->
  <g fill="#211d16">
    <circle cx="90" cy="120" r="2"/><circle cx="700" cy="110" r="2"/><circle cx="120" cy="420" r="2"/>
    <circle cx="690" cy="430" r="2"/><circle cx="400" cy="90" r="2"/><circle cx="60" cy="300" r="2"/><circle cx="740" cy="300" r="2"/>
  </g>

  <!-- contact shadow -->
  <ellipse cx="395" cy="430" rx="180" ry="36" fill="url(#shadow)" filter="url(#soft)"/>

  <!-- the clay blob (a sculpted sphere with a pulled bump) -->
  <path d="M390 110 C462 110 505 126 524 178 C566 214 580 256 544 306 C523 356 470 400 398 405
           C326 410 272 378 255 318 C232 272 238 206 284 160 C320 124 350 110 390 110 Z"
        fill="url(#clay)"/>
  <!-- sheen highlight -->
  <ellipse cx="338" cy="196" rx="70" ry="46" fill="url(#sheen)" transform="rotate(-24 338 196)"/>
  <!-- green rim light along the shaded edge -->
  <path d="M544 306 C523 356 470 400 398 405 C352 408 314 395 288 366"
        fill="none" stroke="#a0ff00" stroke-opacity=".7" stroke-width="5" stroke-linecap="round" filter="url(#soft2)"/>
  <!-- sculpted crease + ridge -->
  <path d="M320 250 C370 230 430 245 470 285" fill="none" stroke="#5c2410" stroke-opacity=".7" stroke-width="9" stroke-linecap="round" filter="url(#soft2)"/>
  <path d="M322 262 C372 244 430 258 468 296" fill="none" stroke="#f0a86a" stroke-opacity=".5" stroke-width="4" stroke-linecap="round" filter="url(#soft2)"/>
  <!-- a small pinched bump -->
  <circle cx="508" cy="214" r="22" fill="#e68a4a" opacity=".55" filter="url(#soft2)"/>

  <!-- sculpt brush cursor over the clay -->
  <g>
    <circle cx="500" cy="212" r="46" fill="none" stroke="#ffffff" stroke-opacity=".9" stroke-width="2.5" stroke-dasharray="7 6"/>
    <circle cx="500" cy="212" r="3.5" fill="#fff"/>
    <path d="M500 212 l78 -52" stroke="#fff" stroke-opacity=".55" stroke-width="2" stroke-dasharray="2 5"/>
    <g transform="translate(578 160)" fill="#fff">
      <path d="M0 0 l5 16 l5 -7 l8 2 z"/>
    </g>
  </g>

  <!-- title band -->
  <rect y="360" width="800" height="240" fill="url(#fade)"/>
  <g text-anchor="middle" font-family="'Arial Black',Impact,sans-serif">
    <text x="400" y="498" font-size="104" font-weight="900" letter-spacing="4" fill="#a0ff00" filter="url(#glow)">LAVA</text>
    <text x="400" y="532" font-size="15" font-weight="700" letter-spacing="5" fill="#ff9b3d">A BLENDER SCULPTING ADD-ON</text>
    <text x="400" y="564" font-size="13" letter-spacing="2" fill="#9a9276">free · install-ready .zip for Blender</text>
  </g>
</svg>
