<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Lava Material">
  <defs>
    <radialGradient id="heat" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#ffd23a"/><stop offset="30%" stop-color="#ff7a1a"/><stop offset="62%" stop-color="#b52a05"/><stop offset="100%" stop-color="#2a0b04"/>
    </radialGradient>
    <linearGradient id="vein" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff4c2"/><stop offset="45%" stop-color="#ffab2e"/><stop offset="100%" stop-color="#ff4d12"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0806" stop-opacity="0"/><stop offset="72%" stop-color="#0a0806" stop-opacity=".55"/><stop offset="100%" stop-color="#070504" stop-opacity=".96"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>

  <!-- molten glow bed -->
  <rect width="800" height="600" fill="url(#heat)"/>
  <!-- dark basalt plates leaving glowing cracks between them -->
  <g fill="#14100d" stroke="#000" stroke-opacity=".3" stroke-width="2">
    <path d="M-10 -10 L250 -10 L300 150 L170 260 L-10 230 Z"/>
    <path d="M270 -10 L560 -10 L540 150 L330 180 L310 150 Z"/>
    <path d="M580 -10 L810 -10 L810 210 L560 200 L556 150 Z"/>
    <path d="M-10 255 L150 280 L230 430 L120 600 L-10 600 Z"/>
    <path d="M180 285 L330 200 L560 220 L520 400 L300 460 L250 440 Z"/>
    <path d="M585 215 L810 230 L810 600 L560 600 L540 420 Z"/>
    <path d="M150 620 L300 480 L520 420 L560 620 Z"/>
  </g>
  <!-- glowing vein highlights along a few cracks -->
  <g stroke="url(#vein)" fill="none" stroke-linecap="round" filter="url(#glow)">
    <path d="M300 150 L310 150 L330 180 L560 200" stroke-width="5" opacity=".95"/>
    <path d="M170 260 L230 430 L120 600" stroke-width="6" opacity=".9"/>
    <path d="M330 200 L520 400 L560 600" stroke-width="4.5" opacity=".85"/>
    <path d="M556 150 L585 215 L810 230" stroke-width="4" opacity=".8"/>
    <path d="M250 440 L520 420" stroke-width="3.5" opacity=".7"/>
  </g>
  <!-- speckle embers -->
  <g fill="#ffd27a" filter="url(#soft)">
    <circle cx="340" cy="300" r="3"/><circle cx="470" cy="360" r="2.4"/><circle cx="210" cy="360" r="2.6"/><circle cx="600" cy="300" r="2.2"/>
  </g>

  <!-- title band -->
  <rect y="360" width="800" height="240" fill="url(#fade)"/>
  <g text-anchor="middle" font-family="'Arial Black',Impact,sans-serif">
    <text x="400" y="500" font-size="72" font-weight="900" letter-spacing="2" fill="#a0ff00" filter="url(#glow)">LAVA MATERIAL</text>
    <text x="400" y="534" font-size="15" font-weight="700" letter-spacing="5" fill="#ff9b3d">SEAMLESS PBR · SUBSTANCE + UNREAL</text>
    <text x="400" y="566" font-size="13" letter-spacing="2" fill="#9a9276">colour · normal · roughness · emissive · height</text>
  </g>
</svg>
