<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="CANDELA — La Nidada Expansion">
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="78%">
      <stop offset="0%" stop-color="#0c1a1f"/><stop offset="68%" stop-color="#08100c"/><stop offset="100%" stop-color="#05060a"/>
    </radialGradient>
    <radialGradient id="egg" cx="42%" cy="34%" r="70%">
      <stop offset="0%" stop-color="#eafff2"/><stop offset="38%" stop-color="#9fe9c7"/><stop offset="70%" stop-color="#3f8f7a"/><stop offset="100%" stop-color="#12352f"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7bd0ff" stop-opacity=".45"/><stop offset="100%" stop-color="#7bd0ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- goo strands -->
  <g stroke="#7bd0ff" stroke-opacity=".28" fill="none" stroke-width="3">
    <path d="M250 60C260 160 240 230 300 300"/><path d="M560 70C540 170 560 240 500 310"/><path d="M400 40C400 140 400 220 400 300"/>
  </g>

  <!-- egg cluster -->
  <g transform="translate(400 250)" filter="url(#glow)">
    <circle cx="0" cy="0" r="120" fill="url(#halo)"/>
    <ellipse cx="-46" cy="18" rx="40" ry="52" fill="url(#egg)"/>
    <ellipse cx="48" cy="22" rx="38" ry="50" fill="url(#egg)"/>
    <ellipse cx="2" cy="-18" rx="52" ry="66" fill="url(#egg)"/>
    <circle cx="2" cy="-22" r="12" fill="#a0ff00" opacity=".9"/>
    <circle cx="-46" cy="14" r="8" fill="#a0ff00" opacity=".7"/>
    <circle cx="48" cy="18" r="8" fill="#a0ff00" opacity=".7"/>
  </g>

  <g text-anchor="middle" font-family="'Arial Black',Impact,sans-serif">
    <text x="400" y="470" font-size="66" font-weight="900" letter-spacing="2" fill="#a0ff00" filter="url(#glow)">CANDELA</text>
    <text x="400" y="500" font-size="16" font-weight="700" letter-spacing="5" fill="#7bd0ff">LA NIDADA · EXPANSION</text>
    <text x="400" y="534" font-size="13" letter-spacing="2" fill="#8c9470">the brood rises · 15 new cards</text>
  </g>
</svg>
