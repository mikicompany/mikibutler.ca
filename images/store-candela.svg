<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="CANDELA — Print and Play Deck">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#16200c"/><stop offset="70%" stop-color="#0a0c08"/><stop offset="100%" stop-color="#05060a"/>
    </radialGradient>
    <radialGradient id="flame" cx="50%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="35%" stop-color="#eaffb0"/><stop offset="62%" stop-color="#a0ff00"/><stop offset="100%" stop-color="#3f8a00"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a0ff00" stop-opacity=".5"/><stop offset="100%" stop-color="#a0ff00" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <g fill="#c9ff57" opacity=".85" filter="url(#glow)">
    <path d="M150 120c7-9 12-3 14 2 3-5 8-10 14-2-4-1-8 0-10 5-2-4-4-5-7-5-4 0-6 1-11 0z"/>
    <path d="M640 150c6-8 10-3 12 1 2-4 6-9 12-1-3-1-7 0-9 4-1-3-3-4-6-4-3 0-5 1-9 0z" opacity=".7"/>
    <path d="M610 300c5-7 9-2 11 1 2-4 6-8 11-1-3-1-6 0-8 4-1-3-3-3-5-3-3 0-5 1-9-1z" opacity=".55"/>
  </g>

  <!-- three fanned card backs -->
  <g transform="translate(400 250)">
    <g transform="rotate(-14) translate(-150 0)"><rect x="-55" y="-78" width="110" height="156" rx="12" fill="#12170c" stroke="#2a331b"/><circle cx="0" cy="-6" r="26" fill="url(#halo)"/><text x="0" y="2" font-size="30" text-anchor="middle" fill="#a0ff00" filter="url(#glow)">🕯</text></g>
    <g transform="rotate(14) translate(150 0)"><rect x="-55" y="-78" width="110" height="156" rx="12" fill="#12170c" stroke="#2a331b"/><circle cx="0" cy="-6" r="26" fill="url(#halo)"/><text x="0" y="4" font-size="30" text-anchor="middle" fill="#ff5db1">💀</text></g>
    <g><circle cx="0" cy="-6" r="70" fill="url(#halo)"/><rect x="-58" y="-82" width="116" height="164" rx="13" fill="#161c0e" stroke="#a0ff00" stroke-opacity=".5"/>
      <path d="M0 -60c16 19 19 32 7 42-7 7-22 6-28-4-6-10-1-22 9-29 1 9 7 10 7 10-1-6 0-13 5-19z" fill="url(#flame)" filter="url(#glow)"/>
      <rect x="-15" y="4" width="30" height="58" rx="4" fill="#e9ead0"/>
    </g>
  </g>

  <g text-anchor="middle" font-family="'Arial Black',Impact,sans-serif">
    <text x="400" y="470" font-size="72" font-weight="900" letter-spacing="3" fill="#a0ff00" filter="url(#glow)">CANDELA</text>
    <text x="400" y="500" font-size="15" font-weight="700" letter-spacing="5" fill="#ff5db1">PRINT &amp; PLAY DECK</text>
    <text x="400" y="534" font-size="13" letter-spacing="2" fill="#8c9470">the full card set · all four factions</text>
  </g>
</svg>
