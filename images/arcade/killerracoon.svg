<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600" viewBox="0 0 400 600" shape-rendering="crispEdges">
  <rect width="400" height="600" fill="#0b0b0b"/>
  <!-- moon + stars -->
  <circle cx="320" cy="90" r="34" fill="#e9e9e6"/>
  <circle cx="332" cy="82" r="30" fill="#0b0b0b"/>
  <g fill="#e9e9e6">
    <rect x="60" y="70" width="3" height="3"/><rect x="120" y="40" width="3" height="3"/>
    <rect x="200" y="60" width="3" height="3"/><rect x="90" y="120" width="3" height="3"/>
    <rect x="260" y="150" width="3" height="3"/>
  </g>
  <!-- raccoon head, 1-bit -->
  <g>
    <rect x="120" y="250" width="36" height="34" fill="#e9e9e6"/>
    <rect x="244" y="250" width="36" height="34" fill="#e9e9e6"/>
    <rect x="110" y="280" width="180" height="130" fill="#e9e9e6"/>
    <!-- mask cut (background) with white eyes -->
    <rect x="110" y="312" width="180" height="52" fill="#0b0b0b"/>
    <rect x="150" y="324" width="26" height="26" fill="#e9e9e6"/>
    <rect x="224" y="324" width="26" height="26" fill="#e9e9e6"/>
    <rect x="158" y="332" width="9" height="9" fill="#0b0b0b"/>
    <rect x="232" y="332" width="9" height="9" fill="#0b0b0b"/>
    <!-- snarl / teeth -->
    <rect x="176" y="384" width="48" height="12" fill="#0b0b0b"/>
    <rect x="180" y="384" width="8" height="12" fill="#e9e9e6"/>
    <rect x="196" y="384" width="8" height="12" fill="#e9e9e6"/>
    <rect x="212" y="384" width="8" height="12" fill="#e9e9e6"/>
  </g>
  <!-- title -->
  <text x="200" y="486" font-family="'Press Start 2P', monospace" font-size="46" font-weight="700"
        fill="#e9e9e6" text-anchor="middle" letter-spacing="2">KILLER</text>
  <text x="200" y="540" font-family="'Press Start 2P', monospace" font-size="46" font-weight="700"
        fill="#e9e9e6" text-anchor="middle" letter-spacing="2">RACOON</text>
</svg>
