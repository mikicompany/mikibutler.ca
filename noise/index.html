<style>
  /* Same dark studio-tool identity as the UV Toolkit, so the kit reads as one family. */
  :root{
    color-scheme:dark;
    --bg:#0f1316; --surface:#161b1f; --surface-2:#1c2228; --border:#28303a; --border-2:#39434f;
    --fg:#e8edf1; --mut:#8d97a3; --faint:#5f6974;
    --accent:#2dd4bf; --accent-2:#5ee7d6; --on-accent:#05211d; --accent-soft:#2dd4bf22;
    --good:#4ade80; --warn:#fbbf24; --bad:#f87171;
    --radius:14px; --shadow:0 2px 12px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{ margin:0; background:var(--bg); color:var(--fg);
    font-family:"Manrope",system-ui,-apple-system,sans-serif; font-size:14px; line-height:1.5;
    -webkit-font-smoothing:antialiased; padding:22px 16px; padding-block:22px; }
  .mono{ font-family:"JetBrains Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums; }
  button{ font-family:inherit; cursor:pointer; color:inherit; }
  a{ color:var(--accent-2); }
  .wrap{ max-width:980px; margin:0 auto; }

  header.top{ display:flex; align-items:center; gap:12px; margin-bottom:16px; }
  .glyph{ width:38px; height:38px; border-radius:10px; flex:none; border:1px solid var(--border-2); box-shadow:var(--shadow);
    background:
      radial-gradient(circle at 30% 30%, #2dd4bf55 0 18%, transparent 20%),
      radial-gradient(circle at 70% 64%, #5ee7d655 0 14%, transparent 16%),
      radial-gradient(circle at 48% 80%, #2dd4bf33 0 20%, transparent 22%),
      var(--surface-2); }
  .top h1{ font-size:19px; font-weight:800; margin:0; letter-spacing:-.3px; }
  .top .sub{ font-size:12px; color:var(--mut); font-weight:600; }
  .top .sp{ flex:1; }
  .home{ font-size:12px; font-weight:700; color:var(--mut); text-decoration:none; border:1px solid var(--border); border-radius:9px; padding:8px 12px; }
  .home:hover{ border-color:var(--accent); color:var(--accent-2); }

  .grid{ display:grid; grid-template-columns:330px 1fr; gap:16px; align-items:start; }
  @media (max-width:760px){ .grid{ grid-template-columns:1fr; } }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow); min-width:0; }
  .card h2{ font-size:12px; font-weight:800; margin:0 0 14px; text-transform:uppercase; letter-spacing:.5px; color:var(--mut); }

  .field{ margin-bottom:14px; }
  .field > label{ display:flex; justify-content:space-between; align-items:baseline; font-size:12px; font-weight:700; margin-bottom:6px; }
  .field .val{ color:var(--accent-2); font-family:"JetBrains Mono",monospace; font-size:12px; }
  select, input[type=number]{ font:14px/1.3 inherit; color:var(--fg); background:var(--surface-2); border:1px solid var(--border); border-radius:9px; padding:9px 10px; width:100%; }
  select:focus, input:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft); }
  input[type=range]{ width:100%; accent-color:var(--accent); }
  .seg{ display:flex; gap:6px; flex-wrap:wrap; }
  .seg button{ flex:1; min-width:58px; padding:8px 6px; border-radius:8px; border:1px solid var(--border); background:var(--surface-2); color:var(--mut); font-weight:700; font-size:12.5px; }
  .seg button.on{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent-2); }
  .row{ display:flex; gap:10px; }
  .row > *{ flex:1; }
  .chk{ display:flex; align-items:center; gap:9px; font-size:13px; font-weight:700; cursor:pointer; margin-bottom:12px; }
  .chk input{ width:18px; height:18px; accent-color:var(--accent); }
  .btn{ font:800 13px/1 inherit; padding:11px 14px; border-radius:9px; border:1px solid var(--border-2); background:var(--surface-2); color:var(--fg); width:100%; }
  .btn:hover{ border-color:var(--accent); color:var(--accent-2); }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--on-accent); }

<body>
<div class="wrap">
  <header class="top">
    <div class="glyph"></div>
    <div><h1>Noise Forge</h1><div class="sub">Seamless procedural material maker · height / normal / rough / AO / metal / colour</div></div>
    <div class="sp"></div>
    <a class="home" href="/">mikibutler.ca ↗</a>
  </header>

  <div class="presets" id="presets">
    <span class="plabel">Presets</span>
    <button data-p="clouds">☁️ Clouds</button>
    <button data-p="rock">🪨 Rock</button>
    <button data-p="billows">⛅ Billows</button>
    <button data-p="cells">🧱 Cells</button>
    <button data-p="cracks">🕸️ Cracks</button>
    <button data-p="lava">🌋 Lava</button>
    <button data-p="sand">🏜️ Sand</button>
    <button data-p="moss">🌿 Moss</button>
    <button data-p="ice">❄️ Ice</button>
    <button data-p="terrain">🗺️ Terrain</button>
  </div>

  <div class="grid">
    <!-- CONTROLS -->
    <div class="card">
      <h2>Noise</h2>
      <div class="field">
        <label for="ntype">Type</label>
        <select id="ntype" class="mono">
          <option value="perlin" selected>Perlin (gradient)</option>
          <option value="value">Value (lattice)</option>
          <option value="worF1">Worley · F1 (cells)</option>
          <option value="worF2">Worley · F2 (rounded)</option>
          <option value="worEdge">Worley · F2−F1 (edges)</option>
        </select>
      </div>
      <div class="field">
        <label>Shape</label>
        <div class="seg" id="shape">
          <button data-v="normal" class="on">Normal</button>
          <button data-v="ridged">Ridged</button>
          <button data-v="billow">Billow</button>
        </div>
      </div>
      <div class="field"><label>Scale <span class="val" id="vScale">6</span></label><input type="range" id="scale" min="1" max="40" step="1" value="6"></div>
      <div class="field"><label>Octaves <span class="val" id="vOct">5</span></label><input type="range" id="oct" min="1" max="8" step="1" value="5"></div>
      <div class="row">
        <div class="field"><label>Gain <span class="val" id="vGain">0.50</span></label><input type="range" id="gain" min="0.2" max="0.75" step="0.01" value="0.5"></div>
        <div class="field"><label>Lacunarity <span class="val" id="vLac">2.0</span></label><input type="range" id="lac" min="1.5" max="3" step="0.1" value="2"></div>
      </div>
      <div class="row">
        <div class="field"><label>Domain warp <span class="val" id="vWarp">0.00</span></label><input type="range" id="warp" min="0" max="1" step="0.02" value="0"></div>
        <div class="field"><label>Warp octaves <span class="val" id="vWarpOct">1</span></label><input type="range" id="warpoct" min="1" max="4" step="1" value="1"></div>
      </div>
      <div class="field">
        <label for="mirror">Symmetry</label>
        <select id="mirror" class="mono">
          <option value="none" selected>None</option>
          <option value="x">Mirror X</option>
          <option value="y">Mirror Y</option>
          <option value="xy">Mirror XY (quad)</option>
        </select>
      </div>

      <div class="divider"></div>
      <label class="chk" style="margin-bottom:12px"><input type="checkbox" id="blendOn"> Blend a second noise</label>
      <div id="layerB" hidden>
        <div class="field">
          <label for="typeB">Layer B type</label>
          <select id="typeB" class="mono">
            <option value="perlin">Perlin (gradient)</option>
            <option value="value">Value (lattice)</option>
            <option value="worF1" selected>Worley · F1 (cells)</option>
            <option value="worF2">Worley · F2 (rounded)</option>
            <option value="worEdge">Worley · F2−F1 (edges)</option>
          </select>
        </div>
        <div class="row">
          <div class="field"><label>B scale <span class="val" id="vScaleB">12</span></label><input type="range" id="scaleB" min="1" max="40" step="1" value="12"></div>
          <div class="field"><label>B octaves <span class="val" id="vOctB">2</span></label><input type="range" id="octB" min="1" max="8" step="1" value="2"></div>
        </div>
        <div class="field">
          <label for="bmode">Blend mode</label>
          <select id="bmode" class="mono">
            <option value="mix" selected>Mix</option>
            <option value="multiply">Multiply</option>
            <option value="add">Add</option>
            <option value="sub">Subtract</option>
            <option value="max">Max (lighten)</option>
            <option value="min">Min (darken)</option>
            <option value="overlay">Overlay</option>
            <option value="diff">Difference</option>

        </div>
        <div class="field"><label>Amount <span class="val" id="vBamount">0.50</span></label><input type="range" id="bamount" min="0" max="1" step="0.01" value="0.5"></div>
      </div>

      <div class="divider"></div>
      <h2>Levels</h2>
      <div class="row">
        <div class="field"><label>Contrast <span class="val" id="vCon">1.00</span></label><input type="range" id="con" min="0.3" max="3" step="0.05" value="1"></div>
        <div class="field"><label>Bright <span class="val" id="vBri">0.00</span></label><input type="range" id="bri" min="-0.4" max="0.4" step="0.02" value="0"></div>
      </div>
      <div class="field"><label>Posterize steps <span class="val" id="vSteps">off</span></label><input type="range" id="steps" min="0" max="12" step="1" value="0"></div>
      <label class="chk"><input type="checkbox" id="invert"> Invert</label>

      <div class="divider"></div>
      <h2>Output map</h2>
      <div class="field">
        <div class="seg" id="omode">
          <button data-v="height" class="on">Height</button>
          <button data-v="normal">Normal</button>
          <button data-v="rough">Rough</button>
          <button data-v="ao">AO</button>
          <button data-v="metal">Metal</button>
          <button data-v="color">Colour</button>
        </div>
      </div>
      <div class="field" id="nStrWrap" hidden><label>Normal strength <span class="val" id="vNstr">2.0</span></label><input type="range" id="nstr" min="0.2" max="6" step="0.1" value="2"></div>
      <div id="roughWrap" hidden>
        <label class="chk"><input type="checkbox" id="roughInv"> Invert roughness</label>
        <div class="row">
          <div class="field"><label>Rough min <span class="val" id="vRoughLo">0.20</span></label><input type="range" id="roughlo" min="0" max="1" step="0.02" value="0.2"></div>
          <div class="field"><label>Rough max <span class="val" id="vRoughHi">0.90</span></label><input type="range" id="roughhi" min="0" max="1" step="0.02" value="0.9"></div>
        </div>
      </div>
      <div class="field" id="aoWrap" hidden><label>AO strength <span class="val" id="vAoStr">2.0</span></label><input type="range" id="aostr" min="0" max="6" step="0.1" value="2"></div>
      <div id="metalWrap" hidden>
        <div class="field"><label>Metal threshold <span class="val" id="vMetalThr">0.60</span></label><input type="range" id="metalthr" min="0" max="1" step="0.02" value="0.6"></div>
        <label class="chk"><input type="checkbox" id="metalInv"> Invert metal mask</label>
      </div>
      <div class="field" id="colorWrap" hidden>
        <label for="ramp">Colour ramp</label>
        <select id="ramp" class="mono">
          <option value="none">Grayscale</option>
          <option value="rock">Rock</option>
          <option value="lava">Lava</option>
          <option value="sand">Sand</option>
          <option value="moss">Moss</option>
          <option value="ice">Ice</option>
          <option value="terrain">Terrain</option>
          <option value="ember">Ember</option>
        </select>
      </div>

      <div class="divider"></div>
      <div class="row" style="align-items:flex-end">
        <div class="field" style="margin:0"><label for="seed">Seed</label><input type="number" id="seed" class="mono" value="1337"></div>
        <button class="btn ghost" id="rnd" style="margin-bottom:0">🎲 Random</button>
      </div>
      <button class="btn" id="copylink" style="margin-top:10px">🔗 Copy share link</button>
      <div class="hintline">Shortcuts: <b>R</b> random · <b>E</b> export PNG · <b>Z</b> material ZIP · <b>L</b> library</div>
    </div>

    <!-- PREVIEW -->
    <div class="card preview">
      <h2>Preview</h2>
      <div class="stage">
        <canvas id="view" width="512" height="512"></canvas>
        <span class="badge" id="badge">Height</span>
      </div>
      <div class="pvfoot">
        <div class="seg" id="tile" style="max-width:220px">
          <button data-v="1" class="on">1×</button>
          <button data-v="2">2×2</button>
          <button data-v="3">3×3</button>
        </div>
        <span class="note" id="seamNote"></span>
      </div>
      <div class="divider"></div>
      <div class="row" style="align-items:flex-end">
        <div class="field" style="margin:0"><label for="eres">Export size</label>
          <select id="eres" class="mono"><option>256</option><option>512</option><option selected>1024</option><option>2048</option><option>4096</option></select>
        </div>
        <button class="btn primary" id="exp" style="margin-bottom:0">⬇ Export PNG</button>
      </div>
      <button class="btn" id="expzip" style="margin-top:8px">📦 Export material pack (ZIP)</button>
      <button class="btn" id="lib" style="margin-top:8px">＋ Send to Library</button>
      <a id="libLink" href="/library" style="display:block;text-align:center;margin-top:8px;font-size:12.5px;font-weight:700;color:var(--accent-2);text-decoration:none">🗂️ Open Texture Library →</a>
      <div class="status" id="status" style="margin-top:8px"></div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id);};
  var PREVIEW=512;

  // ---------- defaults + state ----------
  var DEF={ type:"perlin", shape:"normal", scale:6, oct:5, gain:0.5, lac:2, warp:0, warpOct:1,
            con:1, bri:0, invert:false, steps:0, mirror:"none",
            omode:"height", nstr:2, ramp:"none", roughInv:false, roughLo:0.2, roughHi:0.9,
            aoStr:2, metalThr:0.6, metalInv:false, seed:1337,
            blend:false, typeB:"worF1", scaleB:12, octB:2, bmode:"mix", bamount:0.5 };
  var S=Object.assign({},DEF);
  var tileN=1;

  // ---------- seeded hash / prng ----------
  function hashCell(i,j,s){ var h=(i*374761393 + j*668265263 + s*362437)|0;
    h=Math.imul(h^(h>>>13),1274126177); h=h^(h>>>16); return (h>>>0)/4294967296; }

  var perm=new Uint8Array(512), permReady=-1;
  function buildPerm(seed){ var p=new Uint8Array(256); for(var i=0;i<256;i++)p[i]=i;
    var a=seed>>>0 || 1;
    for(var i2=255;i2>0;i2--){ a^=a<<13;a^=a>>>17;a^=a<<5;a>>>=0; var j=a%(i2+1); var t=p[i2];p[i2]=p[j];p[j]=t; }
    for(var k=0;k<512;k++)perm[k]=p[k&255]; permReady=seed; }
  function fade(t){return t*t*t*(t*(t*6-15)+10);}
  function lerp(a,b,t){return a+(b-a)*t;}
  function grad(h,x,y){ switch(h&7){ case 0:return x+y; case 1:return -x+y; case 2:return x-y; case 3:return -x-y;
    case 4:return x; case 5:return -x; case 6:return y; default:return -y; } }
  // periodic Perlin -> ~[-1,1], seamless over [0,per)
  function perlin(x,y,per){
    var X=Math.floor(x), Y=Math.floor(y), xf=x-X, yf=y-Y;
    function w(v){ v%=per; return v<0?v+per:v; }
    var x0=w(X), x1=w(X+1), y0=w(Y), y1=w(Y+1);
    var u=fade(xf), v=fade(yf);
    var aa=perm[(x0+perm[y0])&255], ba=perm[(x1+perm[y0])&255];
    var ab=perm[(x0+perm[y1])&255], bb=perm[(x1+perm[y1])&255];
    var n0=lerp(grad(aa,xf,yf),     grad(ba,xf-1,yf),   u);
    var n1=lerp(grad(ab,xf,yf-1),   grad(bb,xf-1,yf-1), u);
    return lerp(n0,n1,v);
  }
  // periodic Value noise -> [0,1], seamless over [0,per)
  function valueNoise(x,y,per,seed){
    var X=Math.floor(x), Y=Math.floor(y), xf=x-X, yf=y-Y;
    function w(v){ v%=per; return v<0?v+per:v; }
    var x0=w(X), x1=w(X+1), y0=w(Y), y1=w(Y+1);
    var u=fade(xf), v=fade(yf);
    var a=hashCell(x0,y0,seed), b=hashCell(x1,y0,seed), c=hashCell(x0,y1,seed), dd=hashCell(x1,y1,seed);
    return lerp(lerp(a,b,u), lerp(c,dd,u), v);
  }
  // tileable Worley over a `per`-cell torus
  function worley(x,y,per,seed){
    var ix=Math.floor(x), iy=Math.floor(y), f1=9, f2=9;
    for(var oy=-1;oy<=1;oy++)for(var ox=-1;ox<=1;ox++){
      var cx=ix+ox, cy=iy+oy, wx=((cx%per)+per)%per, wy=((cy%per)+per)%per;
      var rx=hashCell(wx,wy,seed), ry=hashCell(wx,wy,seed^0x9e37);
      var dx=(cx+rx)-x, dy=(cy+ry)-y, d=Math.sqrt(dx*dx+dy*dy);
      if(d<f1){ f2=f1; f1=d; } else if(d<f2){ f2=d; }
    }
    return { f1:Math.min(1,f1), f2:Math.min(1,f2) };
  }

  function tri(c){ c=c-Math.floor(c); return 1-Math.abs(2*c-1); }

  // one fractal layer -> [0,1]
  function fractal(u,v, type, scale, oct, seed){
    var amp=1, max=0, f=scale, per=scale, tot=0;
    if(S.warp>0){
      var wx=0, wy=0, wa=1, wf=scale, wmax=0, wo;
      for(wo=0;wo<S.warpOct;wo++){
        wx += perlin(u*wf+11.3, v*wf+5.1, Math.max(1,Math.round(wf))) * wa;
        wy += perlin(u*wf-7.7,  v*wf+2.9, Math.max(1,Math.round(wf))) * wa;
        wmax+=wa; wa*=0.5; wf*=2;
      }

  $("lib").addEventListener("click",function(){ var res=parseInt($("eres").value,10); $("status").textContent="Saving to Library…";
    setTimeout(function(){ var c=document.createElement("canvas"); c.width=c.height=res; var cx=c.getContext("2d");
      var g=buildHeight(res), ao=(S.omode==="ao"||S.omode==="color")?computeAO(g,res):null; renderMap(cx,res,g,S.omode,ao);
      sendToLibrary(c, libKind(S.omode), noiseName(res,mapLabel(S.omode)), "noise:"+S.type+" scale:"+S.scale+" oct:"+S.oct+" map:"+S.omode+(S.blend?" blendB:"+S.typeB:"")); $("status").textContent=""; },20);
  });
  // The Library viewer is a site page; hide it inside the Claude artifact preview
  if(window.claude&&window.claude.use){ $("lib").hidden=true; var _ll=$("libLink"); if(_ll) _ll.hidden=true; }
  try{ if(window.claude&&claude.use){ claude.use("downloads").then(function(d){ window.__dl=d; }).catch(function(){}); } }catch(e){}

  // ---------- keyboard shortcuts ----------
  document.addEventListener("keydown",function(e){
    var t=(e.target&&e.target.tagName)||""; if(t==="INPUT"||t==="SELECT"||t==="TEXTAREA") return;
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    var k=e.key.toLowerCase();
    if(k==="r"){ $("rnd").click(); }
    else if(k==="e"){ $("exp").click(); }
    else if(k==="z"){ $("expzip").click(); }
    else if(k==="l"){ if(!$("lib").hidden) $("lib").click(); }
  });

  // ---------- boot ----------
  if(readHash()){ syncUIFromState(); }
  else { var fp=document.querySelector('#presets button[data-p="clouds"]'); if(fp) fp.click(); else syncUIFromState(); }
})();
</script>
</body>
</html>
