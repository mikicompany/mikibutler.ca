  <style>
    /* A padlock sitting ABOVE the logo (separate). Pops open on unlock. */
    .lock-stack { display: flex; flex-direction: column; align-items: center; gap: 26px; width: max-content; margin: 6px auto 30px; }
    .lock-stack .padlock { width: 30px; height: 36px; }
    .lock-stack .padlock svg { width: 100%; height: 100%; overflow: visible; display: block; }
    .padlock .shackle {
      fill: none; stroke: #c9cdbf; stroke-width: 8; stroke-linecap: round;
      transform-box: fill-box; transform-origin: 86% 94%;
      transition: transform .6s cubic-bezier(.2,1.7,.5,1), stroke .3s ease;
    }
    .padlock .body { fill: #23271d; stroke: #c9cdbf; stroke-width: 3; transition: stroke .3s ease, filter .3s ease; }
    .padlock .hole { fill: #c9cdbf; transition: fill .3s ease; }
    .lock-stack .logo-wrap { position: relative; width: 82px; height: 82px; }
    .lock-stack .logo-img {
      width: 82px; height: 82px; border-radius: 50%; object-fit: contain; display: block;
      box-shadow: 0 0 0 3px rgba(139,144,128,.4), 0 6px 20px rgba(0,0,0,.55); transition: box-shadow .4s ease;
    }
    .lock-stack .logo-wrap::after {
      content: ''; position: absolute; inset: 0; border-radius: 50%;
      border: 2px solid var(--accent, #a0ff00); opacity: 0; pointer-events: none;
    }
    .lock-stack.unlocked .logo-wrap::after { animation: lockPulse .75s ease-out; }
    @keyframes lockPulse { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(2); } }
    .lock-stack.unlocked .shackle { transform: translateY(-12px) rotate(42deg); stroke: var(--accent, #a0ff00); }
    .lock-stack.unlocked .body { stroke: var(--accent, #a0ff00); filter: drop-shadow(0 0 11px rgba(160,255,0,.6)); }
    .lock-stack.unlocked .hole { fill: var(--accent, #a0ff00); }
    .lock-stack.unlocked .logo-img { box-shadow: 0 0 0 3px var(--accent, #a0ff00), 0 0 32px rgba(160,255,0,.7); }
    .lock-stack.unlocked .padlock { animation: lockPop .5s cubic-bezier(.2,1.6,.4,1); }
    @keyframes lockPop { 0% { transform: scale(1); } 45% { transform: scale(1.22); } 100% { transform: scale(1); } }
    .lock-stack.wrong { animation: lockShake .45s ease; }
    @keyframes lockShake {
      0%,100% { transform: translateX(0); } 15% { transform: translateX(-9px); } 30% { transform: translateX(8px); }
      45% { transform: translateX(-6px); } 60% { transform: translateX(5px); } 75% { transform: translateX(-3px); }
    }
    /* wrong-password glitch: slice the gate into jittering bands + RGB split + colour flashes */
    #pw-gate.glitch { animation: gateGlitch .5s steps(1) 1; }
    @keyframes gateGlitch {
      0%   { transform: translate(0,0); filter: none; clip-path: inset(0 0 0 0); }
      10%  { transform: translate(-5px,2px); filter: hue-rotate(90deg) saturate(2); clip-path: inset(0 0 62% 0); }
      20%  { transform: translate(6px,-2px); filter: none; clip-path: inset(42% 0 22% 0); }
      30%  { transform: translate(-7px,1px); filter: invert(1) hue-rotate(180deg); clip-path: inset(72% 0 4% 0); }
      40%  { transform: translate(5px,-3px); filter: none; clip-path: inset(12% 0 70% 0); }
      50%  { transform: translate(-4px,2px); filter: hue-rotate(-90deg) saturate(2.4); clip-path: inset(0 0 0 0); }
      65%  { transform: translate(3px,1px); filter: none; clip-path: inset(55% 0 30% 0); }
      80%  { transform: translate(-2px,0); filter: none; clip-path: inset(0 0 0 0); }
      100% { transform: translate(0,0); filter: none; clip-path: inset(0 0 0 0); }
    }
    #pw-gate.glitch h1, #pw-gate.glitch #pw-error, #pw-gate.glitch .padlock {
      text-shadow: -2px 0 #ff003c, 2px 0 #00e5ff; animation: rgbJit .5s steps(1) 1;
    }
    @keyframes rgbJit {
      0%,100% { text-shadow: -2px 0 #ff003c, 2px 0 #00e5ff; }
      25% { text-shadow: 3px 0 #ff003c, -3px 0 #00e5ff; }
      50% { text-shadow: -4px 0 #ff003c, 2px 0 #00e5ff; }
      75% { text-shadow: 2px 0 #ff003c, -3px 0 #00e5ff; }
    }
    #pw-gate.glitch .padlock svg { filter: drop-shadow(-2px 0 #ff003c) drop-shadow(2px 0 #00e5ff); }
    /* green sparkle bits flung out on unlock */
    .lock-spark { position: fixed; width: 6px; height: 6px; border-radius: 1px; pointer-events: none; z-index: 99999; }
    #pw-gate { transition: opacity .45s ease, transform .45s ease; }
    #pw-gate.opened { opacity: 0; transform: scale(.96); pointer-events: none; }
    /* info blurb under a media (video/embed) protected tile */
    .pv-blurb { font-size: 11.5px; color: #9aa2ad; line-height: 1.5; margin-top: 7px; }
    /* Protected image tiles: hover slides the text in BIG (like the Hangar tile, scaled up). */
    #protected-grid .item-overlay {
      padding: 26px;
      background: linear-gradient(to top, rgba(0,0,0,.92) 0%, rgba(0,0,0,.55) 48%, transparent 82%);
    }
    #protected-grid .item-overlay .item-tag {
      font-size: 12px; letter-spacing: .1em; margin-bottom: 7px;
      transform: translateY(28px); transition: transform .42s cubic-bezier(.2,.9,.3,1) .02s, opacity .3s ease;
      opacity: 0;
    }
    #protected-grid .item-overlay .item-title {
      font-size: clamp(19px, 2.4vw, 26px); letter-spacing: .03em; line-height: 1.15;
      transform: translateY(28px); transition: transform .42s cubic-bezier(.2,.9,.3,1) .07s, opacity .3s ease;
      opacity: 0;
    }
    #protected-grid .item-overlay .item-desc {
      font-size: clamp(13.5px, 1.4vw, 16px); line-height: 1.55; color: #e2e4e0; margin-top: 10px;
      max-width: 46ch; display: block; -webkit-line-clamp: unset; -webkit-box-orient: unset; overflow: visible;
      transform: translateY(28px); transition: transform .42s cubic-bezier(.2,.9,.3,1) .12s, opacity .3s ease;
      opacity: 0;
    }
    #protected-grid .masonry-item:hover .item-tag,
    #protected-grid .masonry-item:hover .item-title,
    #protected-grid .masonry-item:hover .item-desc { transform: translateY(0); opacity: 1; }
    @media (prefers-reduced-motion: reduce) {
      #protected-grid .item-overlay .item-tag,
      #protected-grid .item-overlay .item-title,
      #protected-grid .item-overlay .item-desc { transition: opacity .2s ease; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .lock-stack .shackle { transition: stroke .3s ease; } .lock-stack.wrong { animation: none; }
      .lock-stack.unlocked .logo-wrap::after, .lock-stack.unlocked .padlock { animation: none; } #pw-gate { transition: opacity .2s ease; }
      #pw-gate.glitch, #pw-gate.glitch h1, #pw-gate.glitch #pw-error, #pw-gate.glitch .padlock { animation: none; text-shadow: none; }
      #pw-gate.glitch .padlock svg { filter: none; }
    }

<body>

  <main>
    <div class="protected-page">

              <circle class="hole" cx="30" cy="52" r="4" />

          <button type="submit" class="btn-accent">Enter</button>

        <p id="pw-error" style="color:#ff4444;font-size:12px;margin-top:12px;min-height:18px"></p>

      <div id="protected-content" style="display:none;width:100%">

    </div>
  </main>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">

    <button class="lightbox-prev" aria-label="Previous">&#8249;</button>

  <script src="js/sidebar.js"></script>
  <script src="js/main.js"></script>
  <script>
    // The protected items live only inside protected-data.json, encrypted
    // with AES-GCM under a key derived from the password (PBKDF2-SHA256).
    // A wrong password fails to decrypt — nothing readable ships in the page.
    // Regenerate the blob locally with tools/protect.html.
    (function () {
      const form = document.getElementById('pw-form');
      const input = document.getElementById('pw-input');
      const error = document.getElementById('pw-error');
      const button = form.querySelector('button');

      const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

      async function decrypt(blob, password) {
        const enc = new TextEncoder();
        const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
        const key = await crypto.subtle.deriveKey(
          { name: 'PBKDF2', hash: 'SHA-256', salt: b64(blob.salt), iterations: blob.iterations },
          keyMaterial,
          { name: 'AES-GCM', length: 256 },
          false,
          ['decrypt']
        );
        const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(blob.iv) }, key, b64(blob.data));
        return JSON.parse(new TextDecoder().decode(plain));
      }

      function render(items) {
        const grid = document.getElementById('protected-grid');
        grid.innerHTML = '';
        const attr = s => String(s == null ? '' : s).replace(/"/g, '&quot;');
        const LOGOS = {
          ea:       { name: 'EA',                  icon: 'https://www.google.com/s2/favicons?domain=ea.com&sz=128' },
          offworld: { name: 'Offworld Industries', icon: 'https://www.google.com/s2/favicons?domain=offworldindustries.com&sz=128' },
          capcom:   { name: 'Capcom',              icon: 'https://www.google.com/s2/favicons?domain=capcom.com&sz=128' },
        };
        const cropStyle = it => {
          const parts = [];
          if (it.focus) parts.push('--focus:' + it.focus);
          if (it.zoom && it.zoom !== 1) parts.push('--zoom:' + it.zoom);
          return parts.length ? ` style="${parts.join(';')}"` : '';
        };
        items.forEach(item => {
          if (item.hidden) return; // hidden in admin — keep in data, skip on the page
          const div = document.createElement('div');
          const isMedia = !!(item.video || item.embed);
          div.className = 'masonry-item' + (isMedia ? ' size-large pv-media-tile' : '');
          div.dataset.title = item.title || '';
          div.dataset.tag = item.tag || '';
          const media = item.embed
            ? `<div class="pv-media"><iframe src="${attr(item.embed)}" title="${attr(item.title)}" frameborder="0" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe></div>`
            : item.video
              ? `<video src="${attr(item.video)}"${item.img ? ` poster="${attr(item.img)}"` : ''} controls playsinline preload="metadata"></video>`
              : `<img src="${attr(item.img)}" alt="" loading="lazy"${cropStyle(item)} />`;
          const owner = LOGOS[item.logo];
          const logo = owner
            ? `<div class="pv-owner"><img src="${attr(owner.icon)}" alt="" /><span>Property of ${owner.name}</span></div>`
            : '';
          const blurb = item.blurb || item.description || '';
          div.dataset.blurb = blurb;
          if (isMedia) {
            div.innerHTML = media + logo + `<div class="pv-caption"></div>` + (blurb ? `<div class="pv-blurb"></div>` : '');
            div.querySelector('.pv-caption').textContent = [item.tag, item.title].filter(Boolean).join(' · ');
            if (blurb) div.querySelector('.pv-blurb').textContent = blurb;
          } else {
            div.innerHTML = media + logo + `
              <div class="item-overlay">
                <span class="item-tag"></span>
                <span class="item-title"></span>
                ${blurb ? '<span class="item-desc"></span>' : ''}
              </div>`;
            div.querySelector('.item-tag').textContent = item.tag || '';
            div.querySelector('.item-title').textContent = item.title || '';
            if (blurb) div.querySelector('.item-desc').textContent = blurb;
          }
          grid.appendChild(div);
        });
        if (window.refreshLightbox) window.refreshLightbox();
      }

      function unlockSound() {
        try {
          var ac = new (window.AudioContext || window.webkitAudioContext)();
          function t(f, d, ty, v, w) {
            var o = ac.createOscillator(), g = ac.createGain(), s = ac.currentTime + (w || 0);
            o.type = ty || 'square'; o.frequency.setValueAtTime(f, s);
            g.gain.setValueAtTime(v || 0.05, s); g.gain.exponentialRampToValueAtTime(0.0001, s + d);
            o.connect(g); g.connect(ac.destination); o.start(s); o.stop(s + d);
          }
          t(1250, 0.04, 'square', 0.05, 0);      // click
          t(300, 0.16, 'triangle', 0.07, 0.05);  // clunk
          // satisfying rising arpeggio
          t(523, 0.10, 'square', 0.05, 0.18);
          t(659, 0.10, 'square', 0.05, 0.27);
          t(784, 0.10, 'square', 0.05, 0.36);
          t(1047, 0.22, 'square', 0.055, 0.45);
        } catch (e) {}
      }

      function glitchSound() {
        try {
          var ac = new (window.AudioContext || window.webkitAudioContext)();
          var now = ac.currentTime;
          // gritty descending buzz
          function buzz(f0, f1, d, w, v) {
            var o = ac.createOscillator(), g = ac.createGain(), s = now + w;
            o.type = 'sawtooth';
            o.frequency.setValueAtTime(f0, s);
            o.frequency.linearRampToValueAtTime(f1, s + d);
            g.gain.setValueAtTime(v, s); g.gain.exponentialRampToValueAtTime(0.0001, s + d);
            o.connect(g); g.connect(ac.destination); o.start(s); o.stop(s + d);
          }
          buzz(180, 60, 0.18, 0, 0.06);
          buzz(90, 40, 0.22, 0.05, 0.05);
          // short white-noise crackle
          var len = Math.floor(ac.sampleRate * 0.12);
          var buf = ac.createBuffer(1, len, ac.sampleRate), ch = buf.getChannelData(0);
          for (var i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / len);
          var src = ac.createBufferSource(), ng = ac.createGain();
          src.buffer = buf; ng.gain.setValueAtTime(0.05, now); ng.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);
          src.connect(ng); ng.connect(ac.destination); src.start(now); src.stop(now + 0.12);
        } catch (e) {}
      }

      function unlockSparkles(el) {
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        var r = el.getBoundingClientRect();
        var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
        var cols = ['#a0ff00', '#c8ff5a', '#7bd200', '#ffffff'];
        for (var i = 0; i < 22; i++) {
          var p = document.createElement('span');
          p.className = 'lock-spark';
          p.style.left = cx + 'px'; p.style.top = cy + 'px';
          p.style.background = cols[(Math.random() * cols.length) | 0];
          document.body.appendChild(p);
          var a = Math.random() * Math.PI * 2, dist = 40 + Math.random() * 90;
          (function (el2, dx, dy) {
            if (el2.animate) {
              el2.animate(
                [ { transform: 'translate(-50%,-50%) scale(1)', opacity: 1 },
                  { transform: 'translate(calc(-50% + ' + dx + 'px),calc(-50% + ' + dy + 'px)) scale(0)', opacity: 0 } ],
                { duration: 600 + Math.random() * 400, easing: 'cubic-bezier(.15,.7,.3,1)' }
              ).onfinish = function () { el2.remove(); };
            } else { el2.remove(); }
          })(p, Math.cos(a) * dist, Math.sin(a) * dist);
        }
      }

      form.addEventListener('submit', async e => {
        e.preventDefault();
        error.textContent = '';
        button.disabled = true;
        button.textContent = 'Checking…';
        try {
          const blob = await fetch('protected-data.json').then(r => {
            if (!r.ok) throw new Error('missing');
            return r.json();
          });
          const payload = await decrypt(blob, input.value);
          render(payload.items || []);
          // Unlock: pop the padlock open, then fade the gate out to reveal the work.
          const lock = document.getElementById('lock');
          const gate = document.getElementById('pw-gate');
          lock.classList.remove('wrong');
          lock.classList.add('unlocked');
          unlockSound();
          unlockSparkles(lock.querySelector('.padlock') || lock);
          button.textContent = 'Unlocked';
          setTimeout(() => {
            gate.classList.add('opened');
            setTimeout(() => {
              document.getElementById('protected-content').style.display = 'block';
              gate.style.display = 'none';
            }, 460);
          }, 700);
          return; // keep the gate/button as-is through the animation
        } catch (err) {
          error.textContent = err.message === 'missing'
            ? 'Protected content is unavailable.' : 'Incorrect password.';
          const lock = document.getElementById('lock');
          lock.classList.remove('wrong'); void lock.offsetWidth; lock.classList.add('wrong');
          const gate = document.getElementById('pw-gate');
          gate.classList.remove('glitch'); void gate.offsetWidth; gate.classList.add('glitch');
          gate.addEventListener('animationend', function h() { gate.classList.remove('glitch'); gate.removeEventListener('animationend', h); });
          glitchSound();
        } finally {
          button.disabled = false;
          if (button.textContent === 'Checking…') button.textContent = 'Enter';
        }
      });
    })();
  </script>
  <script>
    (function () {
      const canvas = document.getElementById('matrix-bg');
      const ctx = canvas.getContext('2d');
      const chars = 'アカサタナハマヤラワ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      const fontSize = 16;
      let columns, drops;

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        columns = Math.floor(canvas.width / fontSize);
        drops = new Array(columns).fill(1);
      }

      function draw() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#a0ff00';
        ctx.font = fontSize + 'px monospace';

        for (let i = 0; i < drops.length; i++) {
          const char = chars[Math.floor(Math.random() * chars.length)];
          ctx.fillText(char, i * fontSize, drops[i] * fontSize);

          if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
            drops[i] = 0;
          }
          drops[i]++;
        }
      }

      resize();
      window.addEventListener('resize', resize);
      setInterval(draw, 40);
    })();
  </script>
