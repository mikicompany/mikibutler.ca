<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Protected Work — Miki Butler</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <aside class="sidebar">
    <a href="index.html" class="sidebar-logo" aria-label="Miki Butler home"><img src="images/logo512.jpg" alt="Miki Butler" /></a>
    <nav id="sidebar-nav"></nav>
    <div class="sidebar-socials" id="sidebar-socials"></div>
    <p class="sidebar-copy">© All rights reserved<br>Miki Butler</p>
  </aside>

  <canvas class="matrix-bg" id="matrix-bg"></canvas>

  <main>
    <div class="protected-page">
      <div class="protected-inner" id="pw-gate">
        <div style="margin-bottom:28px">
          <img src="images/logo512.jpg" alt="Miki Butler" style="width:72px;height:72px;border-radius:50%;object-fit:contain;display:block;margin:0 auto" />
        </div>
        <h1>Protected Material</h1>
        <p>This section contains work under NDA or not yet publicly released.<br>Enter the password to view.</p>
        <form class="protected-form" id="pw-form">
          <input type="password" id="pw-input" placeholder="Password" autocomplete="current-password" />
          <button type="submit" class="btn-accent">Enter</button>
        </form>
        <p id="pw-error" style="color:#ff4444;font-size:12px;margin-top:12px;min-height:18px"></p>
      </div>

      <div id="protected-content" style="display:none;width:100%">
        <div class="work-header">
          <h1>Protected Work</h1>
        </div>
        <div class="masonry-grid" id="protected-grid"></div>
      </div>
    </div>
  </main>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer">
    <span class="lightbox-close" aria-label="Close">&times;</span>
    <button class="lightbox-prev" aria-label="Previous">&#8249;</button>
    <img class="lb-img" src="" alt="" />
    <button class="lightbox-next" aria-label="Next">&#8250;</button>
    <div class="lightbox-caption"></div>
  </div>

  <script src="js/sidebar.js"></script>
  <script src="js/main.js"></script>
  <script>
    // The protected items live only inside protected-data.json, encrypted
    // with AES-GCM under a key derived from the password (PBKDF2-SHA256).
    // A wrong password fails to decrypt — nothing readable ships in the page.
    // Regenerate the blob locally with tools/protect.html.
    (function () {
      const form = document.getElementById('pw-form');
      const input = document.getElementById('pw-input');
      const error = document.getElementById('pw-error');
      const button = form.querySelector('button');

      const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

      async function decrypt(blob, password) {
        const enc = new TextEncoder();
        const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
        const key = await crypto.subtle.deriveKey(
          { name: 'PBKDF2', hash: 'SHA-256', salt: b64(blob.salt), iterations: blob.iterations },
          keyMaterial,
          { name: 'AES-GCM', length: 256 },
          false,
          ['decrypt']
        );
        const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(blob.iv) }, key, b64(blob.data));
        return JSON.parse(new TextDecoder().decode(plain));
      }

      function render(items) {
        const grid = document.getElementById('protected-grid');
        grid.innerHTML = '';
        items.forEach(item => {
          const div = document.createElement('div');
          div.className = 'masonry-item';
          div.dataset.title = item.title || '';
          div.innerHTML = `
            <img src="${item.img}" alt="" loading="lazy" />
            <div class="item-overlay">
              <span class="item-tag"></span>
              <span class="item-title"></span>
            </div>
          `;
          div.querySelector('.item-tag').textContent = item.tag || '';
          div.querySelector('.item-title').textContent = item.title || '';
          grid.appendChild(div);
        });
        if (window.refreshLightbox) window.refreshLightbox();
      }

      form.addEventListener('submit', async e => {
        e.preventDefault();
        error.textContent = '';
        button.disabled = true;
        button.textContent = 'Checking…';
        try {
          const blob = await fetch('protected-data.json').then(r => {
            if (!r.ok) throw new Error('missing');
            return r.json();
          });
          const payload = await decrypt(blob, input.value);
          render(payload.items || []);
          document.getElementById('protected-content').style.display = 'block';
          document.getElementById('pw-gate').style.display = 'none';
        } catch (err) {
          error.textContent = err.message === 'missing'
            ? 'Protected content is unavailable.' : 'Incorrect password.';
        } finally {
          button.disabled = false;
          button.textContent = 'Enter';
        }
      });
    })();
  </script>
  <script>
    (function () {
      const canvas = document.getElementById('matrix-bg');
      const ctx = canvas.getContext('2d');
      const chars = 'アカサタナハマヤラワ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
      const fontSize = 16;
      let columns, drops;

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        columns = Math.floor(canvas.width / fontSize);
        drops = new Array(columns).fill(1);
      }

      function draw() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#a0ff00';
        ctx.font = fontSize + 'px monospace';

        for (let i = 0; i < drops.length; i++) {
          const char = chars[Math.floor(Math.random() * chars.length)];
          ctx.fillText(char, i * fontSize, drops[i] * fontSize);

          if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
            drops[i] = 0;
          }
          drops[i]++;
        }
      }

      resize();
      window.addEventListener('resize', resize);
      setInterval(draw, 40);
    })();
  </script>
</body>
</html>
